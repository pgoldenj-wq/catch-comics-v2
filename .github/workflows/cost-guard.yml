# Catch Cost Guard — scheduled spend check + PR cost-hazard scan.
#
# Hourly job: triggers a collection cycle on production and reports one of
# four outcomes → PASS (green), WARNING (green + annotation), NOT CONFIGURED
# (red) or FAILURE (red). GitHub emails the founder on red, the same
# visible-failure convention as launch-smoke.yml.
#
# NOTIFICATION DEDUP: this file used to assume "GitHub only emails on the
# first failure of a streak". That is false — GitHub emails on every failed
# scheduled run, so the 2026-08-07 Neon incident sent ~30 identical founder
# emails in 30 hours and taught the founder to ignore them. The event store
# already dedupes findings inside alertDedupeWindowMs, so this job now defers
# to its `emittedEvents` count: a genuinely new or changed condition fails the
# run (and emails); an identical continuing one is annotated as a warning and
# re-fails only when the store re-emits (6h) or the condition changes.
#
# A green tick means the check RAN AND HAD TELEMETRY. It never means the
# check was skipped: an unconfigured Cost Guard is a red run, because a
# spend guard with no data is indistinguishable from no spend guard at all.
#
# PR job: runs the zero-dependency cost-hazard scan on changed code.
#
# Secrets required (repo → Settings → Secrets and variables → Actions):
#   COSTGUARD_CRON_SECRET — must match the Vercel env var of the same name.
name: Cost Guard

on:
  schedule:
    - cron: '20 * * * *'   # hourly at :20
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  spend-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger collection and evaluate state
        env:
          SECRET: ${{ secrets.COSTGUARD_CRON_SECRET }}
        run: |
          # Exactly four outcomes. A green tick always means the spend check RAN
          # and had real telemetry behind it — never that it was skipped:
          #   PASS            GREEN + fresh provider data     exit 0
          #   WARNING         AMBER + fresh provider data     exit 0 + ::warning::
          #   NOT CONFIGURED  no secret, or zero telemetry    exit 1 + setup steps
          #   FAILURE         RED / LOCKDOWN / auth / down    exit 1
          if [ -z "$SECRET" ]; then
            echo "::error::Cost Guard NOT CONFIGURED — COSTGUARD_CRON_SECRET is not set as a repo Actions secret, so no spend check ran and nothing is watching spend. Fix: launch/operations/COST-GUARD.md → Secrets."
            {
              echo "### Cost Guard: NOT CONFIGURED :x:"
              echo ""
              echo "\`COSTGUARD_CRON_SECRET\` is missing from **Settings → Secrets and variables → Actions**."
              echo "No usage was collected — **spend protection is not active**."
              echo "See \`launch/operations/COST-GUARD.md\` → Secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for attempt in 1 2 3; do
            HTTP=$(curl -sS -m 55 -X POST \
              -H "Authorization: Bearer $SECRET" \
              -o /tmp/cg-response.json -w '%{http_code}' \
              https://www.catchcomics.com/api/costguard/collect) && break
            echo "attempt $attempt failed; retrying in 20s"; sleep 20
          done
          RESPONSE=$(cat /tmp/cg-response.json 2>/dev/null || echo '')
          if [ -z "$HTTP" ]; then
            echo "::error::Cost Guard collect endpoint unreachable after 3 attempts — spend is unwatched this cycle."
            echo "### Cost Guard: FAILURE :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "Collect endpoint unreachable after 3 attempts." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # 503 = the deployment has no server-side secret. The check did not
          # run, so this is NOT CONFIGURED — never a pass.
          if [ "$HTTP" = "503" ]; then
            echo "::error::Cost Guard NOT CONFIGURED — production reports COSTGUARD_CRON_SECRET is missing from Vercel env, so no spend check ran. Add it to Vercel Production and redeploy (launch/operations/COST-GUARD.md → Secrets)."
            {
              echo "### Cost Guard: NOT CONFIGURED :x:"
              echo ""
              echo "Production returned **503** — server-side \`COSTGUARD_CRON_SECRET\` is not set."
              echo "No usage was collected — **spend protection is not active**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$HTTP" = "401" ]; then
            echo "::error::Cost Guard collect rejected the Actions secret (401) — COSTGUARD_CRON_SECRET differs between GitHub and Vercel."
            echo "### Cost Guard: FAILURE :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "Collect returned **401** — the GitHub and Vercel secrets do not match." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$RESPONSE"
          # A 200 carrying malformed JSON must land in FAILURE, not crash the
          # step with a confusing arithmetic error — hence the defaults.
          STATE=$(echo "$RESPONSE" | jq -r '.state // "UNKNOWN"' 2>/dev/null || true)
          STATE=${STATE:-UNKNOWN}
          FRESH=$(echo "$RESPONSE" | jq -r '(.freshProviders // []) | length' 2>/dev/null || true)
          FRESH=${FRESH:-0}
          FRESH_LIST=$(echo "$RESPONSE" | jq -r '(.freshProviders // []) | join(", ")' 2>/dev/null || true)
          UNCONF=$(echo "$RESPONSE" | jq -r '(.unconfiguredProviders // []) | join(", ")' 2>/dev/null || true)
          STALE=$(echo "$RESPONSE" | jq -r '(.staleProviders // []) | join(", ")' 2>/dev/null || true)
          # Alert dedup is already solved server-side: the event store drops a
          # finding whose dedupeKey repeats inside alertDedupeWindowMs (6h), so
          # emittedEvents > 0 means "something genuinely new or changed", and 0
          # means "the identical condition we already reported". Reusing it here
          # is what turns an hourly incident from 24 founder emails a day into
          # one per genuine change plus a 6-hourly reminder.
          EMITTED=$(echo "$RESPONSE" | jq -r '.emittedEvents // 0' 2>/dev/null || true)
          EMITTED=${EMITTED:-0}
          case "$EMITTED" in ''|*[!0-9]*) EMITTED=0 ;; esac
          echo "Cost Guard state: $STATE (fresh providers: ${FRESH_LIST:-none})"
          if [ "$STATE" = "UNKNOWN" ]; then
            echo "::error::Cost Guard returned no state — endpoint misconfigured."
            echo "### Cost Guard: FAILURE :x:" >> "$GITHUB_STEP_SUMMARY"
            echo "Collect returned no state field." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A real breach outranks everything below, including missing telemetry.
          if [ "$STATE" = "RED" ] || [ "$STATE" = "LOCKDOWN" ]; then
            # An unchanged incident stays loudly visible — annotation, summary,
            # and the Cost Guard page all still say RED — but it does not fail
            # the run again, because a second red run only produces a duplicate
            # email that says nothing new. It re-fails the moment anything
            # changes, and again on the store's own 6-hourly re-emit.
            if [ "$EMITTED" -gt 0 ]; then
              LEVEL=error; VERB="Cost Guard is $STATE"
            else
              LEVEL=warning; VERB="Cost Guard is still $STATE (unchanged since the alert already sent)"
            fi
            echo "::${LEVEL}::${VERB} — check the Cost Guard page / launch/operations/COST-GUARD.md"
            echo "$RESPONSE" | jq -r '.reasons[]?' | while read -r r; do echo "::${LEVEL}::$r"; done
            {
              echo "### Cost Guard: $STATE :rotating_light:"
              echo ""
              echo "Variable MTD \$$(echo "$RESPONSE" | jq -r '.totals.variableMtdUsd') · projected \$$(echo "$RESPONSE" | jq -r '.totals.projectedMonthUsd')"
              echo "$RESPONSE" | jq -r '.reasons[]? | "- " + .'
              echo ""
              if [ "$EMITTED" -gt 0 ]; then
                echo "**New or changed** — this run fails so the founder is emailed."
              else
                echo "_Unchanged since the alert already sent — annotated, not re-failed. It will fail again on any change, or on the store's 6-hourly re-emit._"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$EMITTED" -gt 0 ]; then exit 1; fi
            exit 0
          fi
          # Having checked nothing is not a pass, whatever colour the engine
          # reports. Without telemetry the breakers have nothing to act on.
          if [ "$FRESH" -eq 0 ]; then
            echo "::error::Cost Guard NOT CONFIGURED — collection authenticated but no provider returned telemetry, so no spend was actually observed. Unconfigured: ${UNCONF:-none}. Stale: ${STALE:-none}. See launch/operations/COST-GUARD.md → Manual actions."
            {
              echo "### Cost Guard: NOT CONFIGURED :x:"
              echo ""
              echo "Collection ran and authenticated, but **no provider returned usable telemetry** — no spend was observed."
              echo ""
              echo "- Unconfigured providers: \`${UNCONF:-none}\`"
              echo "- Stale providers: \`${STALE:-none}\`"
              echo ""
              echo "Add provider credentials per \`launch/operations/COST-GUARD.md\` → Manual actions."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A provider blind for 6+ consecutive collections is a failure, not a
          # warning. Without this a single stale provider sits at AMBER forever
          # and AMBER exits 0 — exactly how Neon went unmonitored for 33 hours
          # behind green ticks. staleEscalations counts only NEWLY emitted
          # alerts, so a continuing blackout costs one email plus the store's
          # 6-hourly reminder rather than one an hour.
          PSTALE=$(echo "$RESPONSE" | jq -r '(.persistentStaleProviders // []) | join(", ")' 2>/dev/null || true)
          ESCALATIONS=$(echo "$RESPONSE" | jq -r '.staleEscalations // 0' 2>/dev/null || true)
          ESCALATIONS=${ESCALATIONS:-0}
          case "$ESCALATIONS" in ''|*[!0-9]*) ESCALATIONS=0 ;; esac
          RECOVERED=$(echo "$RESPONSE" | jq -r '(.recoveredProviders // []) | join(", ")' 2>/dev/null || true)
          if [ -n "$RECOVERED" ]; then
            echo "::notice::Cost Guard recovered — $RECOVERED is reporting again after a blackout."
            echo "### Cost Guard: RECOVERED :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$RECOVERED\` is reporting again — its spend is measured once more." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$PSTALE" ]; then
            if [ "$ESCALATIONS" -gt 0 ]; then
              echo "::error::Cost Guard blind spot — $PSTALE has returned no telemetry for 6+ consecutive collections. Its spend is unmonitored and reads as \$0."
              {
                echo "### Cost Guard: BLIND SPOT :x:"
                echo ""
                echo "\`$PSTALE\` has returned no usable telemetry for 6+ consecutive collections."
                echo "That provider's spend is **unmonitored** and contributes \$0 to the totals because it is missing, not because it is zero."
                echo "$RESPONSE" | jq -r '.reasons[]? | "- " + .'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning::Cost Guard blind spot continues — $PSTALE still unmonitored (already reported; not re-failed)."
            {
              echo "### Cost Guard: BLIND SPOT (continuing) :warning:"
              echo ""
              echo "\`$PSTALE\` still unmonitored. Already reported — annotated, not re-failed. Re-fails on the store's 6-hourly re-emit or on any change."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$STATE" = "AMBER" ]; then
            echo "::warning::Cost Guard is AMBER — degraded but inside approved budget. Fresh providers: $FRESH_LIST."
            {
              echo "### Cost Guard: WARNING — AMBER :warning:"
              echo ""
              echo "Fresh \`$FRESH_LIST\` · unconfigured \`${UNCONF:-none}\` · stale \`${STALE:-none}\`"
              echo "$RESPONSE" | jq -r '.reasons[]? | "- " + .'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Cost Guard: PASS — GREEN :white_check_mark:"
            echo ""
            echo "Fresh providers: \`$FRESH_LIST\`"
            echo "Variable MTD \$$(echo "$RESPONSE" | jq -r '.totals.variableMtdUsd') · projected \$$(echo "$RESPONSE" | jq -r '.totals.projectedMonthUsd')"
          } >> "$GITHUB_STEP_SUMMARY"

  # PR-only by design. On the hourly schedule this job reports "Skipped", which
  # is correct and not a symptom — there is no changed code to scan. It is NOT
  # skipped as a consequence of spend-check failing; the two jobs are
  # independent and gated purely on the triggering event.
  cost-hazard-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Scan for concrete cost hazards
        run: node scripts/check-cost-hazards.mjs
