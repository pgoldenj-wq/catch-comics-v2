# Catch Cost Guard — scheduled spend check + PR cost-hazard scan.
#
# Hourly job: triggers a collection cycle on production and FAILS THE
# WORKFLOW when Cost Guard reports RED or LOCKDOWN → GitHub emails the
# founder (same visible-failure convention as launch-smoke.yml). Alert
# dedup happens server-side in the event store; the workflow failing every
# hour during an incident is intentional pressure, not noise — GitHub
# only emails on the first failure of a streak.
#
# PR job: runs the zero-dependency cost-hazard scan on changed code.
#
# Secrets required (repo → Settings → Secrets and variables → Actions):
#   COSTGUARD_CRON_SECRET — must match the Vercel env var of the same name.
name: Cost Guard

on:
  schedule:
    - cron: '20 * * * *'   # hourly at :20
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  spend-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger collection and evaluate state
        env:
          SECRET: ${{ secrets.COSTGUARD_CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::COSTGUARD_CRON_SECRET not set — Cost Guard collection cannot run yet (see COST-GUARD.md manual actions)."
            exit 0
          fi
          for attempt in 1 2 3; do
            RESPONSE=$(curl -sS -m 55 -X POST \
              -H "Authorization: Bearer $SECRET" \
              https://www.catchcomics.com/api/costguard/collect) && break
            echo "attempt $attempt failed; retrying in 20s"; sleep 20
          done
          if [ -z "$RESPONSE" ]; then
            echo "::error::Cost Guard collect endpoint unreachable after 3 attempts."
            exit 1
          fi
          echo "$RESPONSE"
          STATE=$(echo "$RESPONSE" | jq -r '.state // "UNKNOWN"')
          echo "Cost Guard state: $STATE"
          if [ "$STATE" = "RED" ] || [ "$STATE" = "LOCKDOWN" ]; then
            echo "::error::Cost Guard is $STATE — check Mission Control / launch/operations/COST-GUARD.md"
            echo "$RESPONSE" | jq -r '.reasons[]?' | while read -r r; do echo "::error::$r"; done
            exit 1
          fi
          if [ "$STATE" = "UNKNOWN" ]; then
            echo "::error::Cost Guard returned no state — endpoint misconfigured."
            exit 1
          fi

  cost-hazard-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Scan for concrete cost hazards
        run: node scripts/check-cost-hazards.mjs
