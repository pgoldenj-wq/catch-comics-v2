<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Control — Catch Comics</title>
<style>
  :root{
    --bg:#FBFBFA; --surface:#FFFFFF; --ink:#0A0A0A; --ink-2:#5A5A5A; --ink-3:#8A8A8A;
    --line:#E6E5E3; --line-2:#F0EFED;
    --red:#E8272A; --red-bg:#FEF2F2; --red-line:#F6CFCF;
    --green:#0F7B4F; --green-bg:#F1F8F4;
    --amber:#B45309; --amber-bg:#FDF7EC;
    --radius:10px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0B0B0C; --surface:#131315; --ink:#F4F4F5; --ink-2:#A1A1A6; --ink-3:#6E6E76;
      --line:#26262A; --line-2:#1D1D20;
      --red:#FF5A5D; --red-bg:#2A1416; --red-line:#4A1F22;
      --green:#3DBA84; --green-bg:#0F1F18;
      --amber:#E0A253; --amber-bg:#241A0D;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:28px 16px 72px}

  /* ── header ─────────────────────────────────────────────── */
  header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:22px}
  .brand{font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
  h1{font-size:19px; font-weight:650; letter-spacing:-.01em; margin:0}
  .mode{
    margin-left:auto; display:inline-flex; align-items:center; gap:7px;
    font-size:11px; font-weight:650; letter-spacing:.1em; text-transform:uppercase;
    color:var(--red); background:var(--red-bg); border:1px solid var(--red-line);
    padding:4px 10px; border-radius:99px;
  }
  .mode::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--red)}
  .stamp{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}

  /* ── status strip ───────────────────────────────────────── */
  .strip{
    display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; margin-bottom:26px;
  }
  .cell{background:var(--surface); padding:13px 15px; min-width:0}
  .cell .k{font-size:10px; font-weight:650; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}
  .cell .v{font-size:16px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
  .cell .s{font-size:11.5px; color:var(--ink-3); margin-top:2px}
  .v.red{color:var(--red)} .v.green{color:var(--green)} .v.amber{color:var(--amber)}

  /* ── next action ────────────────────────────────────────── */
  .next{
    border:1px solid var(--line); border-left:3px solid var(--red);
    background:var(--surface); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:26px;
  }
  .next .k{font-size:10px; font-weight:650; letter-spacing:.12em; text-transform:uppercase; color:var(--red); margin-bottom:9px}
  .next h2{font-size:23px; line-height:1.28; font-weight:650; letter-spacing:-.02em; margin:0 0 10px}
  .next .why{font-size:14px; color:var(--ink-2); margin:0 0 4px; max-width:74ch}
  .next .dod{font-size:13px; color:var(--ink-3); margin:10px 0 0; max-width:74ch}
  .next .dod b{color:var(--ink-2); font-weight:600}
  .next-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
  .btn{
    display:inline-block; font-size:13px; font-weight:550; text-decoration:none;
    padding:7px 13px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); transition:border-color .12s,background .12s;
  }
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--red); border-color:var(--red); color:#fff}
  .btn.primary:hover{opacity:.9}

  /* ── sections ───────────────────────────────────────────── */
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px}
  section h3{
    font-size:11px; font-weight:650; letter-spacing:.11em; text-transform:uppercase;
    color:var(--ink-3); margin:0 0 10px; display:flex; align-items:center; gap:8px;
  }
  section h3 .n{
    font-size:10.5px; color:var(--ink-2); background:var(--line-2);
    border-radius:99px; padding:1px 7px; font-variant-numeric:tabular-nums;
  }
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .item{padding:14px 16px; border-bottom:1px solid var(--line-2)}
  .item:last-child{border-bottom:0}
  .item .t{font-size:14.5px; font-weight:600; letter-spacing:-.005em; margin-bottom:5px}
  .item .d{font-size:13px; color:var(--ink-2); margin:0 0 6px; max-width:70ch}
  .item .dod{font-size:12.5px; color:var(--ink-3); margin:6px 0 0}
  .item .dod b{color:var(--ink-2); font-weight:600}
  .meta{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:9px}
  .tag{
    font-size:10px; font-weight:650; letter-spacing:.07em; text-transform:uppercase;
    padding:2.5px 7px; border-radius:5px; border:1px solid var(--line); color:var(--ink-3);
  }
  .tag.claude{color:var(--ink-2)}
  .tag.founder{color:var(--red); border-color:var(--red-line); background:var(--red-bg)}
  .tag.todo{color:var(--ink-3)}
  .tag.prog{color:var(--amber); border-color:var(--amber); background:var(--amber-bg)}
  .tag.done{color:var(--green); border-color:var(--green); background:var(--green-bg)}
  .item a.ref{font-size:12.5px; color:var(--red); text-decoration:none}
  .item a.ref:hover{text-decoration:underline}
  code{font-family:var(--mono); font-size:12px; background:var(--line-2); padding:1.5px 5px; border-radius:4px}

  /* ── actions ────────────────────────────────────────────── */
  .acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:11px}
  .act{
    font:inherit; font-size:12.5px; font-weight:550; line-height:1.2;
    padding:6px 11px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    transition:border-color .12s, background .12s, opacity .12s;
  }
  .act:hover:not(:disabled){border-color:var(--ink-3)}
  .act:focus-visible{outline:2px solid var(--red); outline-offset:2px}
  .act:disabled{opacity:.5; cursor:not-allowed}
  .act.run{border-color:var(--red-line); color:var(--red); background:var(--red-bg)}
  .act.run:hover:not(:disabled){border-color:var(--red)}
  .act.busy::before{
    content:""; width:9px; height:9px; border-radius:50%;
    border:1.5px solid currentColor; border-top-color:transparent;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .act.busy::before{animation:none} }
  .act .ext{font-size:10px; color:var(--ink-3)}

  /* quick actions — deliberately quieter than blockers/today */
  .quick .card{background:var(--surface)}
  .qrow{display:flex; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line-2); align-items:flex-start; flex-wrap:wrap}
  .qrow:last-child{border-bottom:0}
  .qmain{flex:1 1 300px; min-width:0}
  .qrow .t{font-size:14px; font-weight:600; margin-bottom:3px}
  .qrow .d{font-size:12.5px; color:var(--ink-3); margin:0; max-width:64ch}
  .qstate{font-size:12.5px; margin-top:7px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .qstate b{font-weight:650}
  .qstate.pass b{color:var(--green)} .qstate.fail b{color:var(--red)}
  .qstate.busy b{color:var(--amber)} .qstate.idle b{color:var(--ink-2)}
  .qstate .when{color:var(--ink-3)}
  .qfail{font-size:12px; color:var(--red); margin-top:5px; max-width:70ch; overflow-wrap:anywhere}
  .qside{flex:0 0 auto; display:flex; gap:7px; align-items:center}

  /* toast — says what just happened, then gets out of the way */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:var(--bg); font-size:13px; font-weight:550;
    padding:10px 16px; border-radius:8px; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; z-index:100; max-width:90vw; text-align:center;
  }
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  /* waiting — visibly not actionable */
  .waiting .item{background:transparent}
  .waiting .card{border-style:dashed; background:transparent}
  .waiting .t{color:var(--ink-2); font-weight:550}
  .waiting .d{color:var(--ink-3)}

  /* ── gates ──────────────────────────────────────────────── */
  .gates{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .gate{background:var(--surface); padding:11px 15px; display:flex; gap:11px; align-items:flex-start}
  .dot{width:7px; height:7px; border-radius:50%; margin-top:6px; flex:0 0 auto}
  .dot.pass{background:var(--green)} .dot.fixing{background:var(--amber)}
  .dot.unknown{background:var(--ink-3)} .dot.waiting{background:var(--amber)}
  .dot.fail{background:var(--red)}
  .gate .gl{font-size:13.5px; font-weight:550}
  .gate .gd{font-size:12px; color:var(--ink-3); margin-top:2px; max-width:56ch}

  /* ── amazon ─────────────────────────────────────────────── */
  .amz{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border-bottom:1px solid var(--line)}
  .amz div{background:var(--surface); padding:12px 15px}
  .amz .k{font-size:10px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px}
  .amz .v{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums}
  .est{font-size:10px; font-weight:650; letter-spacing:.06em; color:var(--amber); background:var(--amber-bg); border:1px solid var(--amber); padding:1.5px 6px; border-radius:5px; display:inline-block; margin-top:5px}
  .ok{font-size:10px; font-weight:650; letter-spacing:.06em; color:var(--green); background:var(--green-bg); border:1px solid var(--green); padding:1.5px 6px; border-radius:5px; display:inline-block; margin-top:5px}

  /* ── after launch ───────────────────────────────────────── */
  details{margin-top:20px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
  summary{
    cursor:pointer; padding:13px 16px; font-size:11px; font-weight:650;
    letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
    list-style:none; display:flex; align-items:center; gap:8px;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸"; font-size:10px; transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  summary:hover{color:var(--ink-2)}
  .deferred{padding:0 16px 8px}
  .deferred .row{padding:10px 0; border-top:1px solid var(--line-2)}
  .deferred .row .t{font-size:13.5px; font-weight:550; margin-bottom:3px}
  .deferred .row .d{font-size:12.5px; color:var(--ink-3); max-width:76ch}

  /* ── footer ─────────────────────────────────────────────── */
  footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--line); display:flex; gap:18px; flex-wrap:wrap; align-items:center}
  footer a{font-size:12.5px; color:var(--ink-2); text-decoration:none}
  footer a:hover{color:var(--ink); text-decoration:underline}
  footer .sep{color:var(--ink-3); font-size:12px}
  .frozen{margin-top:14px; font-size:12px; color:var(--ink-3); max-width:86ch}
  .frozen b{color:var(--ink-2); font-weight:600}
  .err{padding:14px 16px; font-size:13px; color:var(--red); background:var(--red-bg); border:1px solid var(--red-line); border-radius:var(--radius)}

  @media (max-width:820px){
    .strip{grid-template-columns:repeat(2,1fr)}
    .cols{grid-template-columns:1fr}
    .gates{grid-template-columns:1fr}
    .amz{grid-template-columns:repeat(2,1fr)}
    .next h2{font-size:20px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand">Catch Comics</div>
      <h1>Launch Control</h1>
    </div>
    <div class="mode" id="mode">Launch mode</div>
  </header>

  <div id="root"><div class="stamp">Loading…</div></div>

</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* Launch Control reads the files the operational scripts already write.
   No database, no build step, no new state to maintain:
     launch-plan.json                      — the plan (edit this by hand)
     operations/launch-smoke-latest.json   — npm run launch:smoke
     operations/launch-health-latest.json  — npm run launch:health
     operations/launch-signal-latest.json  — npm run launch:signal
     operations/price-verify-status.json   — the running refresh, if any
   Anything it cannot read degrades to "unknown" rather than to a wrong claim. */

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bust = () => '?t=' + Date.now();

async function load(path){
  try{
    const r = await fetch(path + bust(), {cache:'no-store'});
    return r.ok ? await r.json() : null;
  }catch{ return null; }
}

const DAY = 86400000;
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00Z'), now = new Date();
  const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  return Math.round((d.getTime() - today) / DAY);
}
function when(iso){
  const n = daysUntil(iso);
  if(n === null) return '';
  if(n === 0) return 'today';
  if(n === 1) return 'tomorrow';
  if(n < 0)  return Math.abs(n) + ' days ago';
  return 'in ' + n + ' days';
}
const pretty = iso => iso
  ? new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'})
  : '—';

function ago(iso){
  if(!iso) return 'never';
  const mins = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(mins < 1)   return 'just now';
  if(mins < 60)  return mins + 'm ago';
  if(mins < 1440) return Math.round(mins/60) + 'h ago';
  return Math.round(mins/1440) + 'd ago';
}

/* ── The local action bridge ────────────────────────────────────────────────
   127.0.0.1:8319, started by the Command Centre launcher. It owns the jobs:
   fixed argv, shell:false, its own single-flight lock per action, and nothing
   from this page reaches a child process. This page only asks it to start
   something and reads back what it says. If the bridge is not running, every
   button says so rather than failing silently. */
const BRIDGE = 'http://127.0.0.1:8319'
let bridgeUp = null

async function bridge(path, method = 'GET'){
  const r = await fetch(BRIDGE + path, { method, cache:'no-store' })
  const body = await r.json().catch(() => ({}))
  return { ok: r.ok, status: r.status, body }
}

function toast(msg, ms = 3200){
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('on')
  clearTimeout(toast._t)
  toast._t = setTimeout(() => el.classList.remove('on'), ms)
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text)
    return true
  }catch{
    // Clipboard API needs a secure context; http://localhost counts, but a
    // denied permission still lands here. Fall back to the old selection trick.
    try{
      const ta = document.createElement('textarea')
      ta.value = text
      ta.style.cssText = 'position:fixed;top:-1000px'
      document.body.appendChild(ta); ta.select()
      const ok = document.execCommand('copy')
      ta.remove()
      return ok
    }catch{ return false }
  }
}

/* Build the prompt that a regular Claude chat receives. The founder should
   never have to restate the project, the task or the constraints. */
function claudePrompt(plan, a, item){
  const lines = [
    plan.claudeContext, '',
    'Launch Control has identified this action:', '',
    a.task || (item.title || '').toUpperCase(), '',
  ]
  const why = item.why || item.note || item.detail
  if (why) lines.push('Why it matters:', why, '')
  if (item.done) lines.push('Done when:', item.done, '')
  if (a.notes && a.notes.length){
    lines.push('Known context:')
    for (const n of a.notes) lines.push('- ' + n)
    lines.push('')
  }
  lines.push(plan.claudeClosing)
  return lines.join('\n')
}

/* One click: the prompt is on the clipboard AND a new Claude chat opens.
   claude.ai carries ?q= through its login redirect, but this page cannot
   verify that it lands in the composer, so the clipboard is the guarantee and
   the URL is the convenience — never the other way round. */
async function openInClaude(text){
  const copied = await copyText(text)
  // Long prompts are unsafe to put in a URL; the clipboard already has it.
  const enc = encodeURIComponent(text)
  const url = enc.length <= 6000 ? `https://claude.ai/new?q=${enc}` : 'https://claude.ai/new'
  window.open(url, '_blank', 'noopener')
  toast(copied
    ? 'Prompt copied — opening Claude. If the box is empty, paste.'
    : 'Could not copy. Claude is opening; the prompt is in the task above.', 6000)
}

const statusTag = s => ({
  'todo':        '<span class="tag todo">To do</span>',
  'in-progress': '<span class="tag prog">In progress</span>',
  'done':        '<span class="tag done">Done</span>',
}[s] || '<span class="tag todo">To do</span>');

const ownerTag = o =>
  o === 'FOUNDER' ? '<span class="tag founder">Founder</span>'
: o === 'CLAUDE'  ? '<span class="tag claude">Claude</span>' : '';

/* Every actionable item gets a button that says exactly what it will do.
   Handlers are attached after render (no inline JS), keyed by data-act. */
let ACTS = []
function actionsHtml(item){
  if(!item.actions || !item.actions.length) return ''
  const html = item.actions.map(a => {
    const i = ACTS.push({ a, item }) - 1
    if(a.kind === 'link'){
      return `<a class="act" href="${esc(a.href)}" target="_blank" rel="noopener">${esc(a.label)}<span class="ext">↗</span></a>`
    }
    if(a.kind === 'run'){
      return `<button class="act run" data-act="${i}" data-run="${esc(a.action)}">${esc(a.label)}</button>`
    }
    return `<button class="act" data-act="${i}">${esc(a.label)}</button>`
  }).join('')
  return `<div class="acts">${html}</div>`
}

function wireActions(plan){
  for(const btn of document.querySelectorAll('.act[data-act]')){
    const { a, item } = ACTS[Number(btn.dataset.act)]
    btn.addEventListener('click', async () => {
      if(a.kind === 'copy'){
        toast(await copyText(a.text) ? 'Copied to clipboard.' : 'Could not copy.')
      } else if(a.kind === 'command'){
        toast(await copyText(a.command) ? `Copied: ${a.command}` : 'Could not copy.', 4200)
      } else if(a.kind === 'claude'){
        await openInClaude(claudePrompt(plan, a, item))
      } else if(a.kind === 'run'){
        await startJob(a.action)
      }
    })
  }
}

function render(plan, smoke, health, signal, verify){
  if(!plan){
    document.getElementById('root').innerHTML =
      '<div class="err">Could not read <code>launch-plan.json</code>. ' +
      'Launch Control shows nothing rather than guessing. ' +
      'Serve this folder with <code>npx http-server launch/ -p 8317</code>.</div>';
    return;
  }

  /* ── derived state ─────────────────────────────────────── */
  const openBlockers = (plan.blockers||[]).filter(b => b.status !== 'done');
  const openToday    = (plan.today||[]).filter(t => t.status !== 'done').slice(0,3);

  // The next action is decided here, from the plan — never by the reader.
  const next = openBlockers[0] || openToday[0] || null;

  const prodOK   = smoke && smoke.verdict === 'PASS';
  const prodLabel = !smoke ? 'UNKNOWN' : (prodOK ? 'HEALTHY' : 'FAILING');
  const prodClass = !smoke ? 'amber' : (prodOK ? 'green' : 'red');
  const prodSub  = smoke
    ? `${smoke.passed}/${smoke.passed + smoke.warned + smoke.failed} checks · ${ago(smoke.checkedAt)}`
    : 'run npm run launch:smoke';

  const ready = openBlockers.length === 0;
  const amz = plan.amazon || {};

  /* ── status strip ──────────────────────────────────────── */
  const strip = `
    <div class="strip">
      <div class="cell">
        <div class="k">Soft launch</div>
        <div class="v">${pretty(plan.targets?.soft)}</div>
        <div class="s">${when(plan.targets?.soft)}</div>
      </div>
      <div class="cell">
        <div class="k">Public launch</div>
        <div class="v">${pretty(plan.targets?.public)}</div>
        <div class="s">${when(plan.targets?.public)}</div>
      </div>
      <div class="cell">
        <div class="k">Status</div>
        <div class="v ${ready ? 'green' : 'red'}">${ready ? 'READY' : 'NOT READY'}</div>
        <div class="s">${openBlockers.length} blocker${openBlockers.length === 1 ? '' : 's'}</div>
      </div>
      <div class="cell">
        <div class="k">Production</div>
        <div class="v ${prodClass}">${prodLabel}</div>
        <div class="s">${esc(prodSub)}</div>
      </div>
      <div class="cell">
        <div class="k">Amazon</div>
        <div class="v amber">${amz.qualifyingSales ? amz.qualifyingSales.value + ' / ' + amz.qualifyingSales.of : '—'}</div>
        <div class="s">${amz.qualifyingSales && !amz.qualifyingSales.verified ? 'founder estimate' : 'verified'}</div>
      </div>
    </div>`;

  /* ── next action ───────────────────────────────────────── */
  const nextHtml = next ? `
    <div class="next">
      <div class="k">Next action</div>
      <h2>${esc(next.title)}</h2>
      ${next.why ? `<p class="why">${esc(next.why)}</p>` : ''}
      ${next.note ? `<p class="why">${esc(next.note)}</p>` : ''}
      ${next.done ? `<p class="dod"><b>Done when:</b> ${esc(next.done)}</p>` : ''}
      ${actionsHtml(next)}
      <div class="next-actions">
        ${ownerTag(next.owner) ? `<span class="btn" style="cursor:default">${next.owner === 'FOUNDER' ? 'Yours' : 'Claude is on this'}</span>` : ''}
      </div>
    </div>`
  : `<div class="next" style="border-left-color:var(--green)">
       <div class="k" style="color:var(--green)">Next action</div>
       <h2>Nothing is blocking launch.</h2>
       <p class="why">Every blocker is closed. Ship it, then work only P0 and P1 for a week.</p>
     </div>`;

  /* ── blockers + today ──────────────────────────────────── */
  const blockerItems = openBlockers.length ? openBlockers.map(b => `
    <div class="item">
      <div class="t">${esc(b.title)}</div>
      <p class="d">${esc(b.why)}</p>
      <p class="dod"><b>Done when:</b> ${esc(b.done)}</p>
      ${b.evidence ? `<p class="dod">${esc(b.evidence)}</p>` : ''}
      <div class="meta">${ownerTag(b.owner)}${statusTag(b.status)}</div>
      ${actionsHtml(b)}
    </div>`).join('')
  : '<div class="item"><div class="t" style="color:var(--green)">No blockers.</div></div>';

  const todayItems = openToday.length ? openToday.map(t => `
    <div class="item">
      <div class="t">${esc(t.title)}</div>
      ${t.note ? `<p class="d">${esc(t.note)}</p>` : ''}
      <p class="dod"><b>Done when:</b> ${esc(t.done)}</p>
      <div class="meta">${ownerTag(t.owner)}${statusTag(t.status)}</div>
      ${actionsHtml(t)}
    </div>`).join('')
  : '<div class="item"><div class="t">Nothing queued for today.</div></div>';

  /* ── waiting ───────────────────────────────────────────── */
  const waitingItems = (plan.waiting||[]).map(w => {
    let live = '';
    if(w.id === 'W2' && verify && verify.state === 'running'){
      live = ` Live: ${verify.rowsWritten}/${verify.measuredTarget} rows, ${verify.errors} errors.`;
    }
    return `
    <div class="item">
      <div class="t">${esc(w.title)} <span class="tag" style="margin-left:4px">${esc(w.state)}</span></div>
      <p class="d">${esc(w.detail)}${esc(live)}</p>
      ${w.recheck ? `<p class="dod">Re-check: <code>${esc(w.recheck)}</code></p>` : ''}
      ${actionsHtml(w)}
    </div>`;
  }).join('');

  /* ── quick actions ─────────────────────────────────────── */
  const qa = plan.quickActions || { actions: [] };
  const quickHtml = `
    <section class="quick" style="margin-top:20px">
      <h3>Quick actions <span class="n">run these before launch</span></h3>
      <div class="card">
        ${qa.actions.map(a => `
          <div class="qrow" id="q-${esc(a.id)}">
            <div class="qmain">
              <div class="t">${esc(a.label)}</div>
              <p class="d">${esc(a.detail)}</p>
              <div class="qstate idle" data-state><b>—</b></div>
              <div class="qfail" data-fail hidden></div>
            </div>
            <div class="qside">
              ${a.report ? `<a class="act" href="${esc(a.report)}" target="_blank" rel="noopener" data-report hidden>Full report<span class="ext">↗</span></a>` : ''}
              <button class="act run" data-run="${esc(a.id)}">${esc(a.label)}</button>
            </div>
          </div>`).join('')}
      </div>
      <p class="frozen" style="margin-top:9px">${esc(qa.note || '')}</p>
    </section>`;

  /* ── gates ─────────────────────────────────────────────── */
  const gateItems = (plan.gates||[]).map(g => `
    <div class="gate">
      <span class="dot ${esc(g.state)}"></span>
      <div>
        <div class="gl">${esc(g.label)}</div>
        <div class="gd">${esc(g.detail)}</div>
      </div>
    </div>`).join('');

  /* ── amazon ────────────────────────────────────────────── */
  const amazonHtml = `
    <section style="margin-top:20px">
      <h3>Amazon Creators API <span class="n">${amz.blocksLaunch ? 'blocks launch' : 'does not block launch'}</span></h3>
      <div class="card">
        <div class="amz">
          <div>
            <div class="k">Qualifying sales</div>
            <div class="v">${amz.qualifyingSales ? amz.qualifyingSales.value + ' / ' + amz.qualifyingSales.of : '—'}</div>
            <span class="${amz.qualifyingSales && amz.qualifyingSales.verified ? 'ok' : 'est'}">${esc(amz.qualifyingSales ? amz.qualifyingSales.confidence : 'unknown')}</span>
          </div>
          <div>
            <div class="k">Window</div>
            <div class="v" style="font-size:13.5px;font-weight:550">${esc(amz.window)}</div>
          </div>
          <div>
            <div class="k">Code</div>
            <div class="v" style="color:var(--green)">${esc(amz.code)}</div>
            <span class="ok">probed ${esc(amz.lastProbe)}</span>
          </div>
          <div>
            <div class="k">API access</div>
            <div class="v" style="color:var(--amber)">${esc(amz.api)}</div>
            <span class="est">${esc(amz.status)}</span>
          </div>
        </div>
        <div class="item">
          <div class="t">Why waiting will not unlock it</div>
          <p class="d">${esc(amz.theRealProblem)}</p>
          <p class="dod"><b>After eligibility:</b> ${esc(amz.afterEligibility)}</p>
          <p class="dod">Probe: <code>${esc(amz.probe)}</code> — ${esc(amz.apiDetail)}</p>
        </div>
      </div>
    </section>`;

  /* ── soft launch + signal ──────────────────────────────── */
  const sl = plan.softLaunch || {};
  const signalLine = signal
    ? `${signal.clickouts} clickouts from ${signal.visitors} visitors in the trailing ${signal.windowDays} days`
    : 'run npm run launch:signal';
  const softHtml = `
    <section style="margin-top:20px">
      <h3>Soft launch <span class="n">${signalLine}</span></h3>
      <div class="card">
        <div class="item">
          <div class="t">${esc(sl.cohort)}</div>
          <p class="d">The ask: “${esc(sl.ask)}”</p>
          <p class="dod"><b>Measure:</b> ${(sl.measure||[]).map(esc).join(' · ')}</p>
          <p class="dod" style="color:var(--red)">${esc(sl.doNot)}</p>
        </div>
      </div>
    </section>`;

  /* ── after launch ──────────────────────────────────────── */
  const deferred = (plan.afterLaunch||[]).map(a => `
    <div class="row">
      <div class="t">${esc(a.title)}</div>
      <div class="d">${esc(a.detail)}</div>
    </div>`).join('');

  const tri = plan.triage || {};

  document.getElementById('root').innerHTML = `
    ${strip}
    ${nextHtml}
    <div class="cols">
      <section>
        <h3>Blockers <span class="n">${openBlockers.length}</span></h3>
        <div class="card">${blockerItems}</div>
      </section>
      <section>
        <h3>Today <span class="n">${openToday.length} of 3 max</span></h3>
        <div class="card">${todayItems}</div>
      </section>
    </div>

    <section class="waiting" style="margin-bottom:20px">
      <h3>Waiting on someone else</h3>
      <div class="card">${waitingItems}</div>
    </section>

    ${quickHtml}

    <section>
      <h3>Launch gates</h3>
      <div class="gates">${gateItems}</div>
    </section>

    ${amazonHtml}
    ${softHtml}

    <details>
      <summary>After launch — deliberately postponed (${(plan.afterLaunch||[]).length})</summary>
      <div class="deferred">${deferred}</div>
    </details>

    <p class="frozen"><b>Scope freeze.</b> Until public launch, nothing new starts in:
      ${(plan.frozen||[]).map(esc).join(' · ')}.
      First week after launch, only <b>P0</b> (${esc(tri.p0)}) and <b>P1</b> (${esc(tri.p1)}) get worked on.
      Everything else is backlog.</p>

    <footer>
      <a href="smoke-test-v4.html">Smoke Test</a>
      <span class="sep">·</span>
      <a href="mission-control.html">Mission Control (archive)</a>
      <span class="sep">·</span>
      <a href="cost-guard.html">Cost Guard</a>
      <span class="sep">·</span>
      <a href="https://www.catchcomics.com" target="_blank" rel="noopener">catchcomics.com ↗</a>
      <span class="stamp" style="margin-left:auto">
        plan ${esc(plan.updated)} · smoke ${smoke ? ago(smoke.checkedAt) : '—'} · health ${health ? ago(health.generatedAt) : '—'}
      </span>
    </footer>`;

  document.title = (openBlockers.length ? `(${openBlockers.length}) ` : '') + 'Launch Control — Catch Comics';
}

/* ── Job control ────────────────────────────────────────────────────────────
   The bridge owns single-flight; this page does not second-guess it. A 409
   means the bridge refused a duplicate, which is the protection working and is
   reported as such rather than as an error. */
const JOBS = {
  'retailer':      { run:'/retailer/run', status:'/retailer/status', label:'Refresh retailer prices' },
  'browser-trust': { run:'/run',          status:'/status',          label:'Run Browser Trust' },
}

async function startJob(id){
  const job = JOBS[id]
  if(!job) return
  setBusy(id, true)
  try{
    const { status, body } = await bridge(job.run, 'POST')
    if(status === 409 || body.state === 'already-running'){
      toast(`${job.label} is already running.`)
    } else if(status === 202){
      toast(`${job.label} started.`)
    } else {
      toast(`${job.label} could not start (${status}).`, 5000)
    }
  }catch{
    toast('The local action bridge is not running. Start the Command Centre launcher.', 6000)
  }
  setBusy(id, false)
  pollJobs()
}

function setBusy(id, on){
  for(const b of document.querySelectorAll(`.act[data-run="${id}"]`)){
    b.disabled = on
    b.classList.toggle('busy', on)
  }
}

const fmtTime = iso => iso
  ? new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) + ' · ' + ago(iso)
  : '';

/** Render one quick-action row from the bridge's own state. */
function paintJob(id, state, extra){
  const row = document.getElementById('q-' + id)
  if(!row) return
  const el = row.querySelector('[data-state]')
  const fail = row.querySelector('[data-fail]')
  const report = row.querySelector('[data-report]')
  const running = state && state.state === 'running'

  for(const b of row.querySelectorAll('.act[data-run]')){
    b.disabled = running
    b.classList.toggle('busy', running)
    b.textContent = running ? (extra.runningLabel || 'Running…') : (JOBS[id] ? JOBS[id].label : b.textContent)
  }

  let cls = 'idle', text = 'Not run in this session', when = ''
  if(!state){ cls = 'idle'; text = 'Bridge not running' }
  else if(running){ cls = 'busy'; text = extra.runningText || 'Running'; when = fmtTime(state.startedAt) }
  else if(state.state === 'completed'){ cls = 'pass'; text = extra.passText || 'Completed'; when = fmtTime(state.finishedAt) }
  else if(state.state === 'failed' || state.state === 'blocked'){ cls = 'fail'; text = extra.failText || 'Failed'; when = fmtTime(state.finishedAt) }
  else if(extra.idleText){ text = extra.idleText; when = extra.idleWhen || '' }

  el.className = 'qstate ' + cls
  el.innerHTML = `<b>${esc(text)}</b>${when ? `<span class="when">${esc(when)}</span>` : ''}`

  // A run in progress must never carry the previous run's failure next to it:
  // the status file still holds the old outcome until the script writes its
  // first update, and "Running" beside a stale error reads as a live error.
  if(extra.failure && !running){ fail.hidden = false; fail.textContent = extra.failure }
  else { fail.hidden = true; fail.textContent = '' }
  if(report) report.hidden = !extra.showReport
}

let pollTimer = null
async function pollJobs(){
  let anyRunning = false

  // Retailer refresh — bridge state plus the progress file the script writes.
  try{
    const { body } = await bridge('/retailer/status')
    bridgeUp = true
    const pr = body.progress
    const extra = { runningLabel:'Refreshing…', passText:'Completed', failText:'Stopped' }
    if(pr){
      if(pr.state === 'running'){
        // The script reports its own phase; only the verifying phase has
        // counts, so anything earlier says what it is doing instead of
        // inventing a "0 of ?" that looks like a stalled run.
        extra.runningText = (pr.phase === 'verifying' && pr.measuredTarget)
          ? `Verifying ${pr.rowsWritten ?? 0} of ${pr.measuredTarget} listings`
          : (pr.phase ? pr.phase.charAt(0).toUpperCase() + pr.phase.slice(1) : 'Running')
      } else if(pr.state === 'failed'){
        extra.failText = `Stopped after ${pr.rowsWritten ?? 0} listings`
        extra.failure = (pr.reason || '').split('\n').find(l => l.trim()) || 'See price-verify-status.json'
      } else if(pr.rowsWritten){
        extra.passText = `Last run refreshed ${pr.rowsWritten} listings`
      }
      if(body.state === 'idle' && pr.updatedAt){
        extra.idleText = pr.state === 'failed'
          ? `Last run stopped after ${pr.rowsWritten ?? 0} listings`
          : `Last run refreshed ${pr.rowsWritten ?? 0} listings`
        extra.idleWhen = fmtTime(pr.updatedAt)
        if(pr.state === 'failed'){
          extra.failure = (pr.reason || '').split('\n').find(l => l.trim()) || ''
        }
      }
    }
    if(body.state === 'running' || (pr && pr.state === 'running')) anyRunning = true
    paintJob('retailer', body.state === 'running' ? body : (pr && pr.state === 'running' ? { state:'running', startedAt:pr.startedAt } : body), extra)
  }catch{ bridgeUp = false; paintJob('retailer', null, {}) }

  // Browser Trust — bridge state, then the suite's own verdict file.
  try{
    const { body } = await bridge('/status')
    bridgeUp = true
    const bt = await load('operations/browser-trust-latest.json')
    const extra = { runningLabel:'Running…', runningText:'Running the journeys' }
    if(bt){
      const verdict = bt.verdict
      const counts = `${bt.passed} passed · ${bt.failed} failed${bt.skipped ? ` · ${bt.skipped} skipped` : ''}`
      if(body.state === 'idle'){
        extra.idleText = `${verdict} — ${counts}`
        extra.idleWhen = fmtTime(bt.runAt)
      }
      extra.passText = `PASS — ${counts}`
      extra.failText = `${verdict || 'FAIL'} — ${counts}`
      if(verdict !== 'PASS' && bt.failures && bt.failures.length){
        const f = bt.failures[0]
        extra.failure = `${f.test} — ${f.error}` + (bt.failures.length > 1 ? ` (+${bt.failures.length - 1} more)` : '')
      }
      extra.showReport = true
    }
    // An idle bridge with a failing stored verdict must still read as failing.
    let shown = body
    if(body.state === 'idle' && bt){
      shown = { state: bt.verdict === 'PASS' ? 'completed' : 'failed', finishedAt: bt.runAt }
      if(bt.verdict === 'PASS'){ extra.passText = `PASS — ${bt.passed} passed · ${bt.failed} failed` }
    }
    if(body.state === 'running') anyRunning = true
    paintJob('browser-trust', shown, extra)
  }catch{ bridgeUp = false; paintJob('browser-trust', null, {}) }

  clearTimeout(pollTimer)
  pollTimer = setTimeout(pollJobs, anyRunning ? 4000 : 20000)
}

(async () => {
  const [plan, smoke, health, signal, verify] = await Promise.all([
    load('launch-plan.json'),
    load('operations/launch-smoke-latest.json'),
    load('operations/launch-health-latest.json'),
    load('operations/launch-signal-latest.json'),
    load('operations/price-verify-status.json'),
  ]);
  render(plan, smoke, health, signal, verify);
  wireActions(plan);
  // Quick-action buttons live outside the item cards, so they wire separately.
  for(const btn of document.querySelectorAll('.qside .act[data-run]')){
    btn.addEventListener('click', () => startJob(btn.dataset.run));
  }
  pollJobs();
})();
</script>
