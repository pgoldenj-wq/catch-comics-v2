<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch Comics — Founder Review (Smoke Test V4)</title>
<style>
/* ═══ Founder Review System — Smoke Test V4 ═══════════════════════════
   Philosophy: Notion/Linear, not Jira. Issues you just write. Two statuses.
   Claude decides severity, grouping and priority. Joe decides feelings.
   ══════════════════════════════════════════════════════════════════ */
:root {
  --bg:#F8F8F6; --panel:#FFFFFF; --ink:#111111; --ink2:#4B5563; --ink3:#9CA3AF;
  --line:#E5E7EB; --accent:#C41F22; --accent-ink:#FFFFFF;
  --good:#15803D; --good-bg:#DCFCE7; --fix:#B45309; --fix-bg:#FEF3C7;
  --focus:#2563EB;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
button { font:inherit; cursor:pointer; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; border-radius:6px; }

/* ── Layout ── */
.app { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
@media (max-width:860px){ .app { grid-template-columns:1fr; } .rail { position:static; height:auto; border-right:none; border-bottom:1px solid var(--line);} }

/* ── Header ── */
header { grid-column:1/-1; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 22px; background:var(--panel); border-bottom:1px solid var(--line); }
header h1 { font-size:17px; margin:0; letter-spacing:-0.01em; }
header .sub { color:var(--ink2); font-size:13px; }
header .spacer { flex:1; }
.btn { border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:10px; padding:10px 16px; font-weight:600; font-size:14px; min-height:44px; }
.btn:hover { background:#F3F4F6; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.primary:hover { background:#a51a1d; }
.btn.big { font-size:16px; padding:16px 26px; border-radius:14px; width:100%; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }

/* ── Rail ── */
.rail { background:var(--panel); border-right:1px solid var(--line); padding:14px 10px;
  position:sticky; top:0; height:calc(100vh); overflow:auto; }
.rail .railtitle { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink3); padding:6px 12px; }
.pagebtn { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  border:none; background:none; border-radius:10px; padding:12px; margin:2px 0; min-height:48px; }
.pagebtn:hover { background:#F3F4F6; }
.pagebtn.active { background:#111827; color:#fff; }
.pagebtn.active .pmeta { color:#D1D5DB; }
.pagebtn .dot { width:12px; height:12px; border-radius:50%; flex-shrink:0;
  background:#D1D5DB; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); }
.pagebtn .dot.good { background:var(--good); }
.pagebtn .dot.fix  { background:#F59E0B; }
.pagebtn .pname { font-weight:600; font-size:14px; flex:1; min-width:0; }
.pagebtn .pmeta { font-size:11px; color:var(--ink3); }

/* ── Main ── */
main { padding:26px; max-width:880px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:22px; margin-bottom:18px; }
.pagehead h2 { margin:0 0 4px; font-size:24px; letter-spacing:-0.02em; }
.pagehead .why { color:var(--ink2); margin:0 0 10px; max-width:640px; }
.pagehead a.urlchip { display:inline-block; font-size:13px; color:var(--accent);
  text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:6px 14px; }
.pagehead a.urlchip:hover { background:#FEF2F2; }

/* progress blocks */
.progress { display:flex; gap:4px; margin:16px 0 4px; }
.progress span { width:22px; height:10px; border-radius:3px; background:#E5E7EB; }
.progress span.on { background:var(--good); }
.progresslabel { font-size:12px; color:var(--ink3); }

/* checkpoints */
.check { display:flex; gap:12px; align-items:flex-start; padding:10px 8px; border-radius:10px; }
.check:hover { background:#F9FAFB; }
.check input[type=checkbox]{ width:22px; height:22px; margin-top:1px; accent-color:var(--good); cursor:pointer; flex-shrink:0; }
.check label { cursor:pointer; }
.check code { background:#F3F4F6; border-radius:4px; padding:1px 5px; font-size:13px; }

/* issues */
.thoughts textarea { width:100%; min-height:110px; resize:vertical; border:1px solid var(--line);
  border-radius:12px; padding:14px; font:inherit; color:var(--ink); background:#FDFDFC; }
.thoughts textarea:focus { border-color:var(--focus); }
.amend { margin-bottom:14px; }
.amendhead { display:flex; justify-content:space-between; align-items:center;
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink3); margin:0 0 6px; }
.linkbtn { border:none; background:none; color:var(--accent); font-weight:600; font-size:12px;
  padding:6px 8px; min-height:32px; }
.linkbtn:hover { text-decoration:underline; }

/* checkpoint notes */
.addnotebtn { border:none; background:none; color:var(--ink3); font-size:12px; font-weight:600;
  padding:6px 8px; margin-left:auto; flex-shrink:0; min-height:32px; }
.addnotebtn:hover { color:var(--ink); }
.checknote { display:block; width:calc(100% - 42px); margin:2px 0 8px 34px; min-height:60px;
  resize:vertical; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  font:inherit; font-size:13px; color:var(--ink); background:#FDFDFC; }
.checknote:focus { border-color:var(--focus); }
.sectionlabel { font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink3); margin:0 0 10px; }

/* screenshots */
.dropzone { border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center;
  color:var(--ink2); font-size:14px; transition:border-color .15s, background .15s; }
.dropzone.drag { border-color:var(--accent); background:#FEF2F2; }
.dropzone button { border:none; background:none; color:var(--accent); font-weight:700; text-decoration:underline; padding:4px; }
.shots { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-top:14px; }
.shot { position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#111827; }
.shot img { width:100%; height:130px; object-fit:cover; display:block; cursor:pointer; }
.shot .shotbar { display:flex; }
.shot .shotbar button { flex:1; border:none; background:#F9FAFB; border-top:1px solid var(--line);
  font-size:12px; font-weight:600; padding:8px 4px; min-height:36px; }
.shot .shotbar button:hover { background:#EEF2F7; }
.shot .shotbar button.del { color:var(--accent); }
.shot .shotnote { display:block; width:100%; border:none; border-top:1px solid var(--line);
  padding:9px 10px; font:inherit; font-size:12.5px; line-height:1.45; color:var(--ink);
  background:#FDFDFC; min-height:58px; resize:vertical; }
.shot .shotnote:focus { outline-offset:-3px; }
.shot .shotnotelabel { display:block; font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink3); background:#FDFDFC; border-top:1px solid var(--line);
  padding:6px 10px 0; }

/* status — two big choices */
.statusrow { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.statusbtn { border:2px solid var(--line); background:var(--panel); border-radius:14px;
  padding:18px; font-size:16px; font-weight:700; min-height:64px; }
.statusbtn .hint { display:block; font-size:12px; font-weight:500; color:var(--ink3); margin-top:2px; }
.statusbtn.good.on { border-color:var(--good); background:var(--good-bg); color:var(--good); }
.statusbtn.fix.on  { border-color:#F59E0B; background:var(--fix-bg); color:var(--fix); }

/* send panel */
.sendcard { border:2px solid #111827; }
.sendmeta { font-size:13px; color:var(--ink2); margin-top:10px; }
.sendmeta code { background:#F3F4F6; padding:2px 6px; border-radius:6px; }

/* toast */
#toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:#111827; color:#fff; border-radius:12px; padding:14px 22px; font-size:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; max-width:90vw; }
#toast.show { opacity:1; }
#toast.err { background:#991B1B; }

/* annotator modal */
.modal { position:fixed; inset:0; background:rgba(15,18,25,.88); z-index:50;
  display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; padding:18px; }
.modal.open { display:flex; }
.toolrow { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.tool { border:1px solid #374151; background:#1F2937; color:#E5E7EB; border-radius:10px;
  padding:10px 14px; font-size:14px; font-weight:600; min-height:44px; }
.tool.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.swatch { width:34px; height:34px; border-radius:50%; border:3px solid transparent; padding:0; }
.swatch.on { border-color:#fff; }
#annoWrap { max-width:96vw; max-height:70vh; overflow:auto; border-radius:8px; box-shadow:0 10px 50px rgba(0,0,0,.5); }
#annoCanvas { display:block; cursor:crosshair; touch-action:none; }

/* Repo/bridge chip — replaces the old per-handoff directory picker. The repo
   is established once by the local bridge, so this only ever REPORTS. */
.repochip { font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  color:var(--ink2); background:#F9FAFB; white-space:nowrap; }
.repochip.on  { border-color:#A7F3D0; background:#ECFDF5; color:#065F46; }
.repochip.off { border-color:#FECACA; background:#FEF2F2; color:#991B1B; }

.help { font-size:13px; color:var(--ink2); }
kbd { background:#F3F4F6; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Catch Comics — Founder Review</h1>
      <div class="sub">Look at the page. Say how it feels. Paste screenshots. Send it to Claude. <span id="storageState"></span></div>
    </div>
    <div class="spacer"></div>
    <span class="repochip" id="repoChip" title="Where reviews are written">Checking local bridge…</span>
    <button class="btn" id="connectBtn" hidden
      title="Fallback only — pick the repo's launch/ folder by hand if the local bridge is unavailable">🔌 Connect repo (fallback)</button>
    <button class="btn" id="importV3Btn" title="Pull checkpoints, notes and screenshots from Smoke Test V3">Import V3</button>
    <button class="btn" id="exportBtn" title="Download the whole session as JSON">Export</button>
  </header>

  <nav class="rail" aria-label="Pages">
    <div class="railtitle">Pages</div>
    <div id="raillist"></div>
    <p class="help" style="padding:10px 12px">
      <kbd>Ctrl</kbd>+<kbd>V</kbd> pastes a screenshot onto the current page.<br>
      <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> switches pages.
    </p>
  </nav>

  <main id="main"></main>
</div>

<div class="modal" id="annoModal" role="dialog" aria-modal="true" aria-label="Annotate screenshot">
  <div class="toolrow" id="toolRow">
    <button class="tool" data-tool="pen">✏️ Pen</button>
    <button class="tool" data-tool="arrow">➜ Arrow</button>
    <button class="tool" data-tool="rect">▭ Box</button>
    <button class="tool" data-tool="ellipse">◯ Circle</button>
    <button class="tool" data-tool="hilite">🖍 Highlight</button>
    <button class="tool" data-tool="text">T Text</button>
    <button class="swatch" data-color="#DC2626" style="background:#DC2626" aria-label="Red"></button>
    <button class="swatch" data-color="#2563EB" style="background:#2563EB" aria-label="Blue"></button>
    <button class="swatch" data-color="#16A34A" style="background:#16A34A" aria-label="Green"></button>
    <button class="swatch" data-color="#F59E0B" style="background:#F59E0B" aria-label="Amber"></button>
    <button class="tool" id="undoBtn">↩ Undo</button>
    <button class="tool" id="clearBtn">🗑 Clear</button>
    <button class="tool" id="doneBtn" style="background:#16A34A;border-color:#16A34A;color:#fff">✓ Done</button>
  </div>
  <div id="annoWrap"><canvas id="annoCanvas"></canvas></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══ Pages — V3's sections + checkpoints, severity stripped ═════════ */
const PAGES = [
 { id:'homepage', ico:'🏠', title:'Homepage', url:'https://catchcomics.com',
   why:'First impression and the gateway to discovery.',
   checks:['Page loads — no error screen, no blank white page',
     'Hero section visible — headline and <strong>search bar</strong> at the top',
     '“Explore Series” shows <strong>6 series cards</strong>',
     'At least 4 of the 6 series covers load',
     'Navbar has logo, search, and a visible <strong>“Series”</strong> link',
     'Clicking <strong>“Series”</strong> navigates to <code>/series</code>',
     '“Browse all series →” link present and clickable',
     'Footer shows <strong>hello@catchcomics.com</strong>',
     'Footer has all four links: About · Affiliate Disclosure · Privacy · Terms',
     'Cookie notice bar appears at the bottom',
     /* Wave 3 launch checks — appended only (check state is index-keyed) */
     'Hero eyebrow reads <strong>“Comic price comparison, without the tab chaos”</strong> — no “world’s only” anywhere',
     '<strong>“Price finds today”</strong> rail: recognisable series, real covers, honest prices — no “deals” wording, no adult-edge titles',
     'Paste <code>catchcomics.com</code> into Discord/WhatsApp — <strong>og-image share card</strong> renders'] },
 { id:'search', ico:'🔍', title:'Search', url:'https://catchcomics.com',
   why:'Primary way users find a specific comic.',
   checks:['Type <strong>“Saga”</strong> — results appear',
     '“Saga Vol …” or similar relevant titles appear',
     'Click a result — the correct product page loads',
     'Search <strong>“Invincible”</strong> — relevant results appear',
     'Gibberish (<code>xzqjkwp</code>) — clean “no results”, no crash',
     /* Wave 3 launch checks */
     '<strong>“Absolute Batman”</strong> — issues #1–#20 labelled <strong>SINGLE ISSUE</strong>, not Hardcover Edition',
     '“From £…” tags only on results with an ISBN — others say <strong>“Find prices →”</strong> (no wrong-product anchors)',
     '<code>/search</code> with no query — start state appears, <strong>no endless skeletons</strong>'] },
 { id:'series-index', ico:'📚', title:'Series Index', url:'https://catchcomics.com/series',
   why:'The curated catalogue front door.',
   checks:['<code>/series</code> loads without error',
     '<strong>17 series cards</strong> visible in the grid',
     'Covers load on at least 12 of 17 cards',
     'Each card links to <code>/series/[name]</code>',
     'Grid is multi-column on desktop'] },
 { id:'series-pages', ico:'📖', title:'Series Pages', url:'https://catchcomics.com/series/saga',
   why:'The reading-order journey — the core product thesis.',
   checks:['<strong>Saga</strong> — loads, Vol 1 shows ≥2 UK £ prices',
     'Saga — volumes in correct order, no gaps',
     'Saga — Vol 1 has “Start Here” badge; synopsis present',
     '<strong>Invincible</strong> — loads, Vol 1 priced',
     'Invincible — volumes in order, Start Here on Vol 1',
     '<strong>Fullmetal Alchemist</strong> — loads, Vol 1 priced',
     'FMA — volumes in order, Start Here on Vol 1',
     'FMA — Vol 1 cover loads from <code>images.catchcomics.com</code>',
     /* Wave 3 launch checks */
     'Description is a clean first paragraph with <strong>“Series information via ComicVine”</strong> attribution — no raw wiki dump',
     'Unpriced volumes say <strong>“No live price yet”</strong> — never “£0” or a fake price'] },
 { id:'product', ico:'🛒', title:'Product Pages', url:'https://catchcomics.com (Saga → Vol 1)',
   why:'Where the buying decision happens.',
   checks:['Product page loads — no error / blank page',
     'Cover image loads (no placeholder, no broken icon)',
     'Pricing panel shows <strong>≥2 retailers with £ prices</strong>',
     '“Buy at [Retailer]” buttons visible and clickable',
     'Creator credits visible (writer / artist)',
     'Synopsis text visible and readable',
     'eBay section appears within ~5s',
     'Amazon search link visible',
     /* Wave 3 launch checks */
     'No always-empty <strong>Price History</strong> panel — section only exists when a real chart renders',
     'Listing count reads <strong>“(N tracked retailers)”</strong> and doesn’t contradict the All/New/Used tab counts',
     'No greyed-out <strong>stale Amazon</strong> rows (30-day-stale Amazon offers are hidden, not shown)'] },
 { id:'offerstable', ico:'💷', title:'Offers Table', url:'On any product page',
   why:'The price-comparison table is the trust core.',
   checks:['Table renders — one row per retailer, £ price each',
     'Rows sorted cheapest-first',
     '“Best Price” badge only on the cheapest <strong>in-stock</strong> row',
     'Stock labels correct (In stock / Out of stock / Pre-order)',
     '“Checked N days ago” freshness label present',
     'Each row’s Buy/Go button works',
     'Out-of-stock / pre-order rows visually distinct',
     'No duplicate retailer rows'] },
 { id:'affiliate', ico:'💰', title:'Affiliate Flows', url:'Buy button → /go/… → awin1.com',
   why:'Revenue-critical. Verify the full redirect chain.',
   checks:['Find a Bookshop.org / Waterstones / LBB “Buy” button',
     'Copy Link Address → starts with <code>/go/</code> + a long ID',
     'Click → URL becomes <code>awin1.com/cread.php?…</code>',
     'URL contains <code>awinmid=</code> + retailer number',
     'URL contains <code>awinaffid=</code> + your publisher ID',
     'URL contains <code>clickref=cc-</code> + 8 chars',
     'URL contains <code>ued=</code> + an encoded retailer URL',
     '<code>ued=</code> NOT double-wrapped with another awin1.com',
     'You land on the correct retailer product page',
     'eBay links wrap EPN id; Amazon /go/ applies associate tag'] },
 { id:'mobile', ico:'📱', title:'Mobile', url:'catchcomics.com on a phone (375px)',
   why:'A large share of launch traffic is mobile.',
   checks:['Homepage readable — no horizontal scroll',
     'Search bar tappable, keyboard comes up',
     '<code>/series</code> grid stacks readably',
     'Product pricing panel usable — nothing cut off',
     '“Buy” buttons large enough to tap',
     'OffersTable scrolls/stacks without clipping',
     'Footer links readable and tappable',
     /* Wave 3 launch checks */
     '<strong>PHYSICAL PHONE</strong>: product-page issue grid — covers load or show honest #N tiles, taps comfortable, no horizontal overflow'] },
 { id:'loading', ico:'⏳', title:'Loading States', url:'DevTools → throttle Slow 3G',
   why:'Perceived speed — skeletons, never blank flashes.',
   checks:['Homepage shows skeleton/placeholder before content',
     'Series index shows card skeletons while covers load',
     'Product eBay section shows a spinner, then results',
     'Search shows a loading indicator',
     'No large layout shift when content arrives',
     'Slow-3G still resolves gracefully'] },
 { id:'route', ico:'🧭', title:'Route Transitions', url:'Navigate between pages',
   why:'Navigation should feel instant and never lose the URL.',
   checks:['Home → <code>/series</code> — no white flash or crash',
     '<code>/series</code> → series page — smooth',
     'Series page → product page — smooth',
     'Browser <strong>Back</strong> returns correctly',
     'Browser <strong>Forward</strong> works',
     'No red console errors during navigation',
     'URL updates on every navigation'] },
 { id:'errors', ico:'🚧', title:'Error States', url:'catchcomics.com/series/this-does-not-exist',
   why:'Bad URLs must degrade to a friendly 404, never a crash.',
   checks:['<code>/series/this-does-not-exist</code> → branded 404',
     'The 404 links back to home or <code>/series</code>',
     '<code>/product/this-does-not-exist</code> → 404 page',
     'Broken covers fall back gracefully',
     'A failed search/API call shows a message, not a crash'] },
 { id:'covers', ico:'🖼️', title:'Cover Quality', url:'/series, series & product pages',
   why:'Covers carry the visual catalogue.',
   checks:['Series index covers sharp, not pixelated',
     'No Google Books “no preview” placeholders',
     'No blank / 1×1 Open Library images',
     'No grey or broken covers on key launch series',
     'R2 covers load quickly',
     'Product hero cover is high-resolution',
     'Aspect ratios consistent'] },
 { id:'recommendation', ico:'🎯', title:'Recommendations', url:'On a product page',
   why:'Issue grids must show the right comics — no cross-series bleed.',
   checks:['Issues grid shows the correct series',
     'No wrong-series contamination',
     'Issue thumbnails load covers',
     'Issue numbers in order',
     'Clicking a recommendation loads the right product',
     'Recommendations relevant to the comic viewed'] },
 { id:'launch-readiness', ico:'✅', title:'Launch Readiness', url:'Final gate — review all',
   why:'Cross-checks the critical paths and feeds the launch verdict.',
   checks:['All critical pages above reviewed',
     'Nothing above is marked Needs fixing',
     '<code>/privacy</code> and <code>/affiliate-disclosure</code> load',
     '<strong>hello@catchcomics.com</strong> is live and monitored',
     'Affiliate chain verified end-to-end',
     'Analytics + error monitoring live',
     '17 series live with correct reading orders',
     'Mobile confirmed usable',
     /* Wave 3 launch checks */
     '<code>npm run launch:smoke</code> passes against production (security headers included)',
     '<code>npm run launch:health</code> run within 48h — <strong>Amazon staleness decision made</strong>'] },
];

/* ═══ State ══════════════════════════════════════════════════════════ */
const KEY = 'cc-smoke-test-v4';
function blank(){ return { version:4, activePage:PAGES[0].id, pages:{} }; }
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.version===4) return s; } catch(e){} return blank(); }
let state = load();
let saveT = null;
// localStorage now holds only lightweight metadata (checklist, notes, issues,
// shot ids) — screenshot bytes live in IndexedDB (see image storage below), so
// this basically never fills. If it ever does, notes are still on screen.
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try { localStorage.setItem(KEY, JSON.stringify(state)); setStorageState(); } catch(e){ toast('Could not autosave metadata — your notes are still on screen. Export as a backup.','err'); } }, 250); }
// Short stable id. Issues need one so a screenshot can point at an issue and
// keep pointing at it after the issues above it are reordered or deleted —
// an array index would silently re-attach the photo to the wrong problem.
function uid(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function blankIssue(){ return { id: uid(), problem:'', expected:'', ts: Date.now() }; }

function P(id){
  if(!state.pages[id]) state.pages[id] = { status:null, issues:[blankIssue()], checks:{}, checkNotes:{}, shots:[], lastSentAt:null, lastReviewedAt:null, send:null };
  const ps = state.pages[id];
  // Lazy migration, oldest shape first — existing progress is never wiped.
  // v4.0: one `thoughts` box → v4.1: `amends` strings → v4.2: `issues` objects
  // with stable ids, so screenshots can be attached to a specific issue.
  if (!Array.isArray(ps.issues)){
    let texts = [];
    if (Array.isArray(ps.amends)) texts = ps.amends;
    else if (typeof ps.thoughts === 'string' && ps.thoughts.trim()) texts = [ps.thoughts];
    ps.issues = (texts.length ? texts : ['']).map(t => ({ id: uid(), problem: String(t || ''), expected:'', ts: Date.now() }));
    delete ps.amends; delete ps.thoughts;
  }
  if (!ps.issues.length) ps.issues = [blankIssue()];
  ps.issues.forEach(it => { if (!it.id) it.id = uid(); if (typeof it.expected !== 'string') it.expected = ''; });
  if (!ps.checkNotes) ps.checkNotes = {};
  (ps.shots || []).forEach(s => {
    if (typeof s.note !== 'string') s.note = '';
    if (typeof s.issueId === 'undefined') s.issueId = null;   // older shots are page-level
  });
  return ps;
}
// Append a non-duplicate issue (used by the V3 importer)
function pushIssue(ps, text){
  if (!text || ps.issues.some(it => it.problem.includes(text))) return false;
  if (ps.issues.length === 1 && !ps.issues[0].problem.trim()) ps.issues[0].problem = text;
  else ps.issues.push({ ...blankIssue(), problem: text });
  return true;
}
// Issues the founder actually wrote something in.
function realIssues(ps){ return ps.issues.filter(it => it.problem.trim() || it.expected.trim()); }
// Checkpoint-note editors stay open once toggled (until the note is emptied
// and the page re-renders) — transient UI state, deliberately not persisted.
const openCheckNotes = new Set();
// Same for the optional "expected behaviour" box on an issue: shown once the
// founder asks for it, hidden again only when it is emptied.
const openExpected = new Set();
function def(id){ return PAGES.find(p=>p.id===id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function setStorageState(){
  const el = document.getElementById('storageState'); if (!el) return;
  let shots = 0; for (const pid in state.pages) shots += (state.pages[pid].shots||[]).length;
  let pct = '';
  if (navigator.storage && navigator.storage.estimate){
    try { const { usage, quota } = await navigator.storage.estimate(); if (quota) pct = ` · storage ${Math.round(usage/quota*100)}% used`; } catch(e){}
  }
  el.textContent = `· ${shots} screenshot${shots===1?'':'s'} stored${pct}`;
}

/* ═══ Screenshot image storage — IndexedDB, not localStorage ══════════
   Root cause of "storage full": full-size base64 screenshots were kept in
   localStorage (~5MB cap), so a few annotated shots filled it. Image bytes
   now live in IndexedDB (hundreds of MB); localStorage keeps only the
   lightweight shot metadata {id, note, ops, ts}. Text always saves even if
   image storage is full — they're separate stores.                       */
const imgCache = new Map();  // shot.id -> { src, flat }  (session mirror of IDB)

// Resize to a sane max width + JPEG encode. Keeps screenshots and annotations
// legible for Claude/debugging while cutting stored bytes ~10-20x vs full PNG.
function compressImage(dataUrl, maxW = 1600, quality = 0.82){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      try { c.getContext('2d').drawImage(img, 0, 0, w, h); resolve(c.toDataURL('image/jpeg', quality)); }
      catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}
// Resolve a shot's display / handoff image: session cache first, then IDB.
async function shotImage(shot){
  let rec = imgCache.get(shot.id);
  if (!rec){ rec = await idb.getImg(shot.id); if (rec) imgCache.set(shot.id, rec); }
  return rec ? (rec.flat || rec.src) : null;
}
// Early friendly warning, well before anything actually fails.
async function storagePressure(){
  if (!navigator.storage || !navigator.storage.estimate) return;
  try { const { usage, quota } = await navigator.storage.estimate();
    if (quota && usage/quota > 0.8) toast(`Storage ${Math.round(usage/quota*100)}% full — Export soon, then delete old screenshots. Your notes stay safe.`, 'err');
  } catch(e){}
}

function toast(msg, cls){ const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (cls==='err'?' err':''); clearTimeout(toastT); toastT = setTimeout(()=>{ t.className=''; }, 4200); }

/* ═══ Screenshots ════════════════════════════════════════════════════ */
function addShotFile(file){
  const r = new FileReader();
  r.onload = ()=> addShotSrc(r.result);
  r.readAsDataURL(file);
}
async function addShotSrc(raw){
  const ps = P(state.activePage);
  const src = await compressImage(raw);
  const id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  imgCache.set(id, { src, flat:null });
  ps.shots.push({ id, note:'', ops:[], ts:Date.now() });   // metadata only — no bytes in state
  ps.lastReviewedAt = Date.now();
  save(); render();   // instant: thumbnail hydrates from the session cache
  try { await idb.setImg(id, { src, flat:null }); toast('Screenshot added — click it to draw'); }
  catch(e){ toast('Screenshot saved for this session, but disk storage is full — Export & delete old screenshots to keep it.','err'); }
  storagePressure();
}
document.addEventListener('paste', e=>{
  const items = [...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith('image/'));
  if (!items.length) return;
  if (e.target && e.target.id === 'thoughts' ) { /* allow pasting text into thoughts; images still captured */ }
  items.forEach(i=>{ const f = i.getAsFile(); if (f) addShotFile(f); });
});

/* ═══ Annotator ══════════════════════════════════════════════════════
   Vector ops per shot: {tool,color,points|x0..|text}. Flattened PNG kept
   alongside for thumbnails, prompts and exports.                       */
let anno = null; // { shotIdx, img, ops, tool, color, drawing, start, cur }
const cv = document.getElementById('annoCanvas');
const cx = cv.getContext('2d');

async function openAnnotator(i){
  const ps = P(state.activePage), shot = ps.shots[i];
  const rec = imgCache.get(shot.id) || await idb.getImg(shot.id);
  if (!rec || !rec.src){ toast('Could not load that screenshot','err'); return; }
  const img = new Image();
  img.onload = ()=>{
    anno = { shotIdx:i, img, ops:[...(shot.ops||[])], tool:'pen', color:'#DC2626', drawing:false };
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    document.getElementById('annoModal').classList.add('open');
    syncTools(); redraw();
  };
  img.src = rec.src;   // annotate over the ORIGINAL, replaying stored vector ops
}
function syncTools(){
  document.querySelectorAll('#toolRow .tool[data-tool]').forEach(b=> b.classList.toggle('on', anno && b.dataset.tool===anno.tool));
  document.querySelectorAll('#toolRow .swatch').forEach(b=> b.classList.toggle('on', anno && b.dataset.color===anno.color));
}
document.querySelectorAll('#toolRow .tool[data-tool]').forEach(b=> b.onclick = ()=>{ anno.tool = b.dataset.tool; syncTools(); });
document.querySelectorAll('#toolRow .swatch').forEach(b=> b.onclick = ()=>{ anno.color = b.dataset.color; syncTools(); });
document.getElementById('undoBtn').onclick = ()=>{ anno.ops.pop(); redraw(); };
document.getElementById('clearBtn').onclick = ()=>{ anno.ops = []; redraw(); };
document.getElementById('doneBtn').onclick = closeAnnotator;
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && anno) closeAnnotator(); });

function lw(){ return Math.max(3, Math.round(cv.width/300)); }
function drawOp(o){
  cx.strokeStyle = o.color; cx.fillStyle = o.color; cx.lineWidth = lw(); cx.lineCap='round'; cx.lineJoin='round';
  if (o.tool==='pen'){ cx.beginPath(); o.points.forEach((pt,i)=> i?cx.lineTo(pt[0],pt[1]):cx.moveTo(pt[0],pt[1])); cx.stroke(); }
  if (o.tool==='rect'){ cx.strokeRect(o.x0,o.y0,o.x1-o.x0,o.y1-o.y0); }
  if (o.tool==='ellipse'){ cx.beginPath(); cx.ellipse((o.x0+o.x1)/2,(o.y0+o.y1)/2,Math.abs(o.x1-o.x0)/2,Math.abs(o.y1-o.y0)/2,0,0,7); cx.stroke(); }
  if (o.tool==='hilite'){ cx.save(); cx.globalAlpha=.32; cx.fillRect(o.x0,o.y0,o.x1-o.x0,o.y1-o.y0); cx.restore(); }
  if (o.tool==='arrow'){
    cx.beginPath(); cx.moveTo(o.x0,o.y0); cx.lineTo(o.x1,o.y1); cx.stroke();
    const a = Math.atan2(o.y1-o.y0,o.x1-o.x0), h = lw()*4;
    cx.beginPath(); cx.moveTo(o.x1,o.y1);
    cx.lineTo(o.x1-h*Math.cos(a-0.5), o.y1-h*Math.sin(a-0.5));
    cx.lineTo(o.x1-h*Math.cos(a+0.5), o.y1-h*Math.sin(a+0.5));
    cx.closePath(); cx.fill();
  }
  if (o.tool==='text'){ cx.font = `bold ${lw()*7}px sans-serif`; cx.fillText(o.text, o.x0, o.y0); }
}
function redraw(preview){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.drawImage(anno.img,0,0);
  anno.ops.forEach(drawOp);
  if (preview) drawOp(preview);
}
function evPos(e){
  const r = cv.getBoundingClientRect();
  const sx = cv.width/r.width, sy = cv.height/r.height;
  const px = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
  const py = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
  return [px*sx, py*sy];
}
cv.addEventListener('pointerdown', e=>{
  if (!anno) return;
  const [x,y] = evPos(e);
  if (anno.tool==='text'){
    const text = prompt('Label text:');
    if (text) { anno.ops.push({tool:'text', color:anno.color, x0:x, y0:y, text}); redraw(); }
    return;
  }
  anno.drawing = true; anno.start = [x,y];
  if (anno.tool==='pen') anno.ops.push({tool:'pen', color:anno.color, points:[[x,y]]});
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e=>{
  if (!anno || !anno.drawing) return;
  const [x,y] = evPos(e);
  if (anno.tool==='pen'){ anno.ops[anno.ops.length-1].points.push([x,y]); redraw(); }
  else redraw({tool:anno.tool, color:anno.color, x0:anno.start[0], y0:anno.start[1], x1:x, y1:y});
});
cv.addEventListener('pointerup', e=>{
  if (!anno || !anno.drawing) return;
  anno.drawing = false;
  const [x,y] = evPos(e);
  if (anno.tool!=='pen'){
    const dx = Math.abs(x-anno.start[0]), dy = Math.abs(y-anno.start[1]);
    if (dx>4 || dy>4) anno.ops.push({tool:anno.tool, color:anno.color, x0:anno.start[0], y0:anno.start[1], x1:x, y1:y});
  }
  redraw();
});
async function closeAnnotator(){
  redraw();
  const ps = P(state.activePage), shot = ps.shots[anno.shotIdx];
  shot.ops = anno.ops;   // vector ops stay in state (tiny, keeps annotations re-editable)
  const flat = anno.ops.length ? cv.toDataURL('image/jpeg', 0.85) : null;
  const rec = imgCache.get(shot.id) || await idb.getImg(shot.id) || {};
  rec.flat = flat;
  imgCache.set(shot.id, rec);
  document.getElementById('annoModal').classList.remove('open');
  anno = null;
  save(); render();
  try { await idb.setImg(shot.id, rec); }
  catch(e){ toast('Annotation saved for this session, but disk storage is full — Export & delete old screenshots.','err'); }
}

/* ═══ Prompt generation ══════════════════════════════════════════════
   Evidence stays attached to its source: checkpoint notes sit under
   their checkpoint, screenshot notes travel with their file, issues
   remain separate numbered items.                                     */
function buildPrompt(p, ps, shotFiles){
  const plain = s => s.replace(/<[^>]+>/g,'');
  const checked = p.checks.filter((_,i)=>ps.checks[i]).length;

  const checkLines = p.checks.map((c,i)=>{
    const note = (ps.checkNotes[i] || '').trim();
    return `- [${ps.checks[i] ? 'x' : ' '}] ${plain(c)}${note ? `\n      NOTE: ${note}` : ''}`;
  }).join('\n');

  const issues = realIssues(ps);
  const issueBlock = issues.length
    ? issues.map((it,i)=>{
        const n = i + 1;
        const mine = ps.shots
          .map((s,si)=>({ s, f: shotFiles && shotFiles[si] ? shotFiles[si] : `screenshot ${si+1}` }))
          .filter(x=>x.s.issueId === it.id);
        const lines = [`ISSUE ${n}:`, `Problem: ${it.problem.trim() || '(see screenshots)'}`];
        if (it.expected.trim()) lines.push(`Expected: ${it.expected.trim()}`);
        lines.push(mine.length
          ? `Screenshots: ${mine.map(x=>x.f).join(', ')}`
          : 'Screenshots: (none attached to this issue)');
        for (const x of mine) if ((x.s.note||'').trim()) lines.push(`      ${x.f} NOTE: ${x.s.note.trim()}`);
        return lines.join('\n');
      }).join('\n\n')
    : '(no written issues — rely on the screenshots and checkpoint notes)';

  const loose = ps.shots.map((s,i)=>({ s, f: shotFiles && shotFiles[i] ? shotFiles[i] : `screenshot ${i+1}` }))
                        .filter(x=>!x.s.issueId);
  const shotLines = loose.length
    ? loose.map(x=>{
        const note = (x.s.note || '').trim();
        return `- ${x.f}${x.s.ops && x.s.ops.length ? '  (founder annotations flattened in)' : ''}${note ? `\n      NOTE: ${note}` : ''}`;
      }).join('\n')
    : '(none — every screenshot is attached to an issue above)';

  return `# CATCH COMICS — FOUNDER REVIEW

SECTION: ${p.title}
PRODUCTION: ${p.url.startsWith('http') ? p.url : 'https://catchcomics.com'}
FOUNDER VERDICT: ${ps.status==='good' ? 'Looks good' : ps.status==='fix' ? 'NEEDS FIXING' : 'No verdict given'}

CHECKPOINTS (${checked}/${p.checks.length} confirmed — notes belong to the checkpoint above them):
${checkLines}

FOUNDER ISSUES (separate items — do not merge them unless they share a root cause.
Each issue names the screenshots that belong to IT; do not mix them up):
${issueBlock}

PAGE-LEVEL SCREENSHOTS (not tied to one issue; each note describes the markup on THAT screenshot):
${shotLines}

TASK:
1. Diagnose root causes — measure the live DOM, don't guess from the description.
2. Ignore nitpicks; group related issues.
3. Determine actual severity yourself — the founder deliberately does not triage.
4. Implement safe, contained fixes directly. Plan anything risky before building.
5. Production-verify every change.
6. Update the founder-review status and dashboard afterwards.

ACT AS: Product Director · UX Lead · Frontend Engineer · Collector Advocate.
Trust, accessibility and conversion matter more than visual experimentation.
Wrong data is worse than missing data.
Keep design language consistent across the entire site.`;
}

/* ═══ Repo connection (File System Access API) ═══════════════════════ */
let dirHandle = null;   // handle to the repo's launch/ folder

const idb = {
  db: null,
  open(){ if (idb.db) return Promise.resolve(); return new Promise((res,rej)=>{ const q = indexedDB.open('cc-frv4',2);
    q.onupgradeneeded = ()=>{ const db = q.result;
      if (!db.objectStoreNames.contains('kv'))   db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('imgs')) db.createObjectStore('imgs'); };
    q.onsuccess = ()=>{ idb.db = q.result; res(); }; q.onerror = rej; }); },
  get(k){ return new Promise((res)=>{ const t = idb.db.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>res(null); }); },
  set(k,v){ return new Promise((res)=>{ const t = idb.db.transaction('kv','readwrite').objectStore('kv').put(v,k); t.onsuccess=()=>res(); t.onerror=()=>res(); }); },
  // Screenshot image bytes ({src, flat} per shot id) — kept out of localStorage.
  // setImg REJECTS on quota error so callers can warn; get/del swallow errors.
  getImg(id){ return new Promise((res)=>{ try { const t = idb.db.transaction('imgs').objectStore('imgs').get(id); t.onsuccess=()=>res(t.result||null); t.onerror=()=>res(null); } catch(e){ res(null); } }); },
  setImg(id,v){ return new Promise((res,rej)=>{ try { const t = idb.db.transaction('imgs','readwrite').objectStore('imgs').put(v,id); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); } catch(e){ rej(e); } }); },
  delImg(id){ return new Promise((res)=>{ try { const t = idb.db.transaction('imgs','readwrite').objectStore('imgs').delete(id); t.onsuccess=()=>res(); t.onerror=()=>res(); } catch(e){ res(); } }); },
};

async function connectRepo(){
  if (!window.showDirectoryPicker){ toast('This browser lacks the File System Access API — Send will download files instead','err'); return; }
  try {
    dirHandle = await window.showDirectoryPicker({ id:'cc-launch', mode:'readwrite' });
    await idb.set('dir', dirHandle);
    toast(`Connected: ${dirHandle.name}/ — reviews will be written into the repo`);
    render();
  } catch(e){ /* user cancelled */ }
}
async function restoreRepo(){
  try {
    await idb.open();
    const h = await idb.get('dir');
    if (!h) return;
    const perm = await h.queryPermission({ mode:'readwrite' });
    if (perm === 'granted'){ dirHandle = h; render(); }
    else {
      // one-click re-grant button in header
      const btn = document.getElementById('connectBtn');
      btn.textContent = '🔌 Re-connect repo';
      btn.onclick = async ()=>{ if ((await h.requestPermission({mode:'readwrite'})) === 'granted'){ dirHandle = h; btn.textContent='🔌 Connected'; toast('Repo re-connected'); render(); } };
    }
  } catch(e){}
}

function dataUrlToBytes(u){ const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length); for (let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }

async function writeFile(dir, name, content){
  const fh = await dir.getFileHandle(name, { create:true });
  const w = await fh.createWritable();
  await w.write(content);
  await w.close();
}

async function writeFounderJson(){
  if (!dirHandle) return;
  const pages = {};
  PAGES.forEach(p=>{ const ps = P(p.id); pages[p.id] = {
    title: p.title,
    status: ps.status,
    checkpoints: `${Object.values(ps.checks).filter(Boolean).length}/${p.checks.length}`,
    shots: ps.shots.length,
    lastReviewedAt: ps.lastReviewedAt ? new Date(ps.lastReviewedAt).toISOString() : null,
    lastSentAt: ps.lastSentAt ? new Date(ps.lastSentAt).toISOString() : null,
  }; });
  await writeFile(dirHandle, 'founder-review.json', JSON.stringify({ updated:new Date().toISOString(), tool:'smoke-test-v4', pages }, null, 2));
}

/* ═══ SEND TO CLAUDE ═════════════════════════════════════════════════
   One button, one press, no clipboard. The page POSTs the review as DATA to
   the local Catch Comics bridge (127.0.0.1:8319, the same one that runs
   Browser Trust); the bridge owns every filesystem write and starts Claude
   Code itself. The page cannot name a file, a folder or a command — see
   launch/operations/founder-review-handler.mjs.

   The repo is not chosen here. The bridge knows where it lives because it
   lives inside it, which is what retired the per-handoff directory picker.  */
const BRIDGE = 'http://127.0.0.1:8319';
let bridgeHealth = null;          // null = not probed yet, false = unavailable
let sendInFlight = false;         // guard 1: a click already being processed
const pollers = new Map();        // pageId -> interval id

function bridgeFetch(path, opts, ms){
  return fetch(BRIDGE + path, { ...opts, mode:'cors', signal: AbortSignal.timeout(ms || 8000) });
}
async function probeBridge(){
  try {
    const r = await bridgeFetch('/review/health', {}, 4000);
    bridgeHealth = r.ok ? await r.json() : false;
  } catch(e){ bridgeHealth = false; }
  return bridgeHealth;
}

/* ── Honest status text ──────────────────────────────────────────────
   Every string below describes something that actually happened. A launched
   process is never reported as a finished repair.                        */
const STATE_TEXT = {
  sending:   s => `Packaging ${s.issues} issue${s.issues===1?'':'s'} and ${s.shots} screenshot${s.shots===1?'':'s'}…`,
  packaged:  s => `Saved · ${s.issues} issue${s.issues===1?'':'s'} · ${s.shots} screenshot${s.shots===1?'':'s'} · starting Claude…`,
  launching: s => `Sent · ${s.issues} issue${s.issues===1?'':'s'} · ${s.shots} screenshot${s.shots===1?'':'s'} · starting Claude…`,
  running:   s => `Sent · ${s.issues} issue${s.issues===1?'':'s'} · ${s.shots} screenshot${s.shots===1?'':'s'} · <strong>Claude repair running</strong>`,
  completed: s => `<strong>Claude repair complete</strong> · ${s.issues} issue${s.issues===1?'':'s'} reviewed`,
  failed:    s => `<strong>Claude repair did not finish.</strong> Your review is saved at <code>${esc(s.packagePath||'')}</code>`,
  blocked:   s => `<strong>Review saved — Claude was not started.</strong>`,
};

function sendCardMeta(p, ps){
  const s = ps.send;
  if (!s){
    const issues = realIssues(ps).length, shots = ps.shots.length;
    if (bridgeHealth === false){
      return `<strong>Command Centre is not running</strong>, so this button cannot start Claude.<br>` +
             `Reopen this page through <code>open-command-centre</code> to send in one click, or use the fallback below.`;
    }
    if (bridgeHealth && !bridgeHealth.claude.available){
      return `Sends ${issues} issue${issues===1?'':'s'} and ${shots} screenshot${shots===1?'':'s'} straight into the repo.<br>` +
             `<strong>Claude Code was not found on this machine</strong> — the review will still be saved.`;
    }
    return `Writes the review and every screenshot into the repo and starts the Claude repair. Nothing to copy or paste.` +
           (ps.lastSentAt ? `<br>Last sent: ${new Date(ps.lastSentAt).toLocaleString()}` : '');
  }
  const line = (STATE_TEXT[s.state] || (x=>`State: ${esc(x.state)}`))(s);
  const detail = s.reason ? `<br><span style="color:var(--bad)">${esc(s.reason)}</span>` : '';
  const where  = s.packagePath && s.state !== 'failed' ? `<br>Package: <code>${esc(s.packagePath)}</code>` : '';
  const resume = s.sessionId && (s.state==='completed'||s.state==='failed')
    ? `<br>Read what Claude did: <code>claude --resume ${esc(s.sessionId)}</code>` : '';
  const summary = s.summary ? `<br><span style="color:var(--ink2)">${esc(String(s.summary).slice(0,300))}</span>` : '';
  return line + detail + where + resume + summary;
}

/** Repaint just the send card, without re-rendering (and losing focus in) the
 *  textareas the founder may still be typing in. */
function paintSendCard(p, ps){
  const meta = document.getElementById('sendMeta');
  const btn  = document.getElementById('sendBtn');
  const fb   = document.getElementById('fallbackRow');
  if (!meta || !btn) return;
  meta.innerHTML = sendCardMeta(p, ps);

  const st = ps.send?.state;
  const busy = st === 'sending' || st === 'packaged' || st === 'launching' || st === 'running';
  const label = st === 'running'   ? 'Claude repair running…'
              : st === 'sending'   ? 'Packaging…'
              : st === 'launching' || st === 'packaged' ? 'Starting Claude…'
              : st === 'completed' ? `Send ${p.title} to Claude again`
              : (st === 'blocked' || st === 'failed') ? 'Retry sending to Claude'
              : `🚀 SEND ${p.title.toUpperCase()} TO CLAUDE`;
  btn.textContent = label;
  btn.disabled = busy;
  btn.style.opacity = busy ? '.55' : '';
  btn.style.cursor  = busy ? 'default' : '';

  // The manual route stays available, but only ever as a fallback — it is
  // never the normal journey and is labelled so it cannot be mistaken for it.
  if (fb){
    const offline = bridgeHealth === false;
    fb.innerHTML = offline
      ? `<button class="btn" id="fallbackBtn" style="margin-top:10px">Fallback: download the review + copy the prompt</button>`
      : `<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--ink2)">Fallback (only if the bridge is down)</summary>
         <button class="btn" id="fallbackBtn" style="margin-top:8px">Download the review + copy the prompt</button></details>`;
    const b = document.getElementById('fallbackBtn');
    if (b) b.onclick = ()=> manualFallback(p, ps);
  }
}

/** Build the bridge submission. Data only — no paths, no commands. */
async function buildSubmission(p, ps, reviewId){
  const issues = realIssues(ps).map(it => ({
    uid: it.id, problem: it.problem.trim(), expected: it.expected.trim(), createdAt: it.ts || null,
  }));
  const screenshots = [];
  for (const s of ps.shots){
    const dataUrl = await shotImage(s);          // flattened annotations if any
    if (!dataUrl) continue;                       // image bytes lost — skip, don't fake it
    screenshots.push({
      issueUid: s.issueId || null,
      note: (s.note || '').trim(),
      annotated: !!(s.ops && s.ops.length),
      dataUrl,
    });
  }
  return {
    reviewId, tool:'smoke-test-v4',
    page: { id:p.id, title:p.title, url:p.url },
    verdict: ps.status,
    issues, screenshots,
    checkpoints: p.checks.map((c,i)=>({
      label: String(c).replace(/<[^>]+>/g,''),
      checked: !!ps.checks[i],
      note: (ps.checkNotes[i] || '').trim(),
    })),
  };
}

/** Poll the bridge until the repair really finishes. */
function watchRun(p){
  clearInterval(pollers.get(p.id));
  const iv = setInterval(async ()=>{
    const ps = P(p.id);
    if (!ps.send?.reviewId){ clearInterval(iv); pollers.delete(p.id); return; }
    let rec = null;
    try {
      const r = await bridgeFetch(`/review/status?reviewId=${encodeURIComponent(ps.send.reviewId)}`, {}, 6000);
      if (r.ok) rec = await r.json();
    } catch(e){ return; }                        // a blip is not a verdict — keep polling
    if (!rec) return;
    Object.assign(ps.send, rec); save();
    paintSendCard(def(state.activePage), P(state.activePage));
    if (rec.state === 'running' || rec.state === 'launching' || rec.state === 'packaged') return;
    clearInterval(iv); pollers.delete(p.id);
    if (rec.state === 'completed')    toast(`Claude repair complete for ${p.title} — ${rec.counts?.issues ?? 0} issues reviewed`);
    else if (rec.state === 'blocked') toast(`${p.title} review saved, but Claude was not started — ${rec.reason || 'see the card'}`, 'err');
    else                              toast(`Claude repair did not finish for ${p.title} — your review is saved`, 'err');
  }, 2500);
  pollers.set(p.id, iv);
}

async function sendToClaude(){
  if (sendInFlight) return;                       // guard 1: double-click
  const p = def(state.activePage), ps = P(p.id);

  const issues = realIssues(ps).length, shots = ps.shots.length;
  const hasEvidence = issues || shots || Object.values(ps.checkNotes).some(n=>String(n).trim()) || ps.status === 'fix';
  if (!hasEvidence){
    toast('Write an issue, add a screenshot or note, or mark “Needs fixing” first','err'); return;
  }
  // guard 2: a run already in flight for this page
  if (ps.send && ['sending','packaged','launching','running'].includes(ps.send.state)){
    toast('This page has already been sent — Claude is still working on it'); return;
  }

  sendInFlight = true;
  // guard 3: one stable id per submission, reused by every retry, so the
  // bridge can recognise a repeat and refuse to package or launch twice.
  const reviewId = ps.send?.reviewId && ['blocked','failed'].includes(ps.send.state)
    ? ps.send.reviewId
    : `${p.id}-${new Date().toISOString().slice(0,16).replace(/[T:]/g,'-')}-${uid().slice(0,6)}`;

  ps.send = { reviewId, state:'sending', issues, shots, reason:null, packagePath:null };
  save(); paintSendCard(p, ps);

  try {
    if (bridgeHealth === null) await probeBridge();
    if (bridgeHealth === false){
      ps.send = { ...ps.send, state:'blocked',
        reason:'The local Catch Comics bridge is not running. Reopen this page through open-command-centre, then press Retry — nothing has been lost.' };
      save(); paintSendCard(p, ps);
      toast('Command Centre is not running — nothing was sent','err');
      return;
    }

    const body = await buildSubmission(p, ps, reviewId);
    const r = await bridgeFetch('/review/submit', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body),
    }, 180000);                                   // screenshots can be large

    let rec = null;
    try { rec = await r.json(); } catch(e){}
    if (!r.ok){
      ps.send = { ...ps.send, state:'blocked', reason: rec?.error || `The bridge refused the review (HTTP ${r.status}).` };
      save(); paintSendCard(p, ps);
      toast(rec?.error || 'The bridge refused the review','err');
      return;
    }

    ps.send = { ...ps.send, ...rec };
    ps.lastSentAt = Date.now();
    // launch/founder-review.json is updated by the bridge, not from here —
    // it owns every write, so Mission Control stays current without a picker.
    save(); paintSendCard(p, ps); renderRail();

    if (rec.duplicate) toast('Already sent — showing the run that is already in progress');
    else if (rec.state === 'blocked') toast(`Review saved to ${rec.packagePath} — Claude was not started`, 'err');
    else toast(`Sent · ${rec.counts?.issues ?? issues} issues · ${rec.counts?.screenshots ?? shots} screenshots · Claude repair running`);

    if (['packaged','launching','running'].includes(rec.state)) watchRun(p);
  } catch(e){
    console.error(e);
    ps.send = { ...ps.send, state:'blocked', reason:`Could not reach the local bridge: ${e.message}. Your review is still here — press Retry.` };
    save(); paintSendCard(p, ps);
    toast('Could not reach the local bridge — nothing was lost','err');
  } finally {
    sendInFlight = false;
    paintSendCard(def(state.activePage), P(state.activePage));
  }
}

/* ── Fallback only ───────────────────────────────────────────────────
   Kept for the case the bridge is genuinely unavailable. Never the normal
   journey: it is behind a disclosure, and it says what it is.            */
/** Same naming the bridge uses, so a fallback package reads identically to a
 *  bridge-written one: grouped by issue, numbered within that issue. */
function fallbackShotNames(ps){
  const seq = {};
  return ps.shots.map(s=>{
    const n = ps.issues.findIndex(it=>it.id===s.issueId);
    const key = n >= 0 ? `issue-${String(n+1).padStart(2,'0')}` : 'page';
    seq[key] = (seq[key] || 0) + 1;
    return `${key}-shot-${seq[key]}.jpg`;
  });
}

async function manualFallback(p, ps){
  const stamp = new Date().toISOString().slice(0,16).replace(/[T:]/g,'-');
  const folder = `${p.id}-${stamp}`;
  const shotFiles = fallbackShotNames(ps);
  const prompt = buildPrompt(p, ps, shotFiles);
  const blob = new Blob([prompt], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${folder}-review.md`; a.click();
  for (let i=0;i<ps.shots.length;i++){
    const src = await shotImage(ps.shots[i]);
    if (!src) continue;
    const b = document.createElement('a');
    b.href = src; b.download = `${folder}-${shotFiles[i]}`; b.click();
  }
  try { await navigator.clipboard.writeText(prompt); } catch(e){}
  ps.lastSentAt = Date.now(); save(); render();
  toast('Fallback: package downloaded + prompt copied. Paste into Claude Code and attach the shots.');
}

/* ═══ Import from V3 ═════════════════════════════════════════════════ */
async function importV3(){
  let v3 = null;
  try { v3 = JSON.parse(localStorage.getItem('cc-smoke-test-v3')); } catch(e){}
  if (!v3){ toast('No V3 session found in this browser profile','err'); return; }
  let checks = 0, notes = 0, shots = 0, issues = 0;
  const V3MAP = { 'homepage':'homepage','search':'search','series-index':'series-index','series-pages':'series-pages',
    'product':'product','offerstable':'offerstable','affiliate':'affiliate','mobile':'mobile','loading':'loading',
    'route':'route','errors':'errors','covers':'covers','recommendation':'recommendation','launch-readiness':'launch-readiness' };
  Object.entries(v3.sections||{}).forEach(([sid, sec])=>{
    const pid = V3MAP[sid]; if (!pid) return;
    const ps = P(pid);
    Object.entries(sec.checks||{}).forEach(([i,v])=>{ if (v===true || v==='pass' || v==='checked'){ ps.checks[i]=true; checks++; } });
    if (sec.notes && pushIssue(ps, '[V3 notes] ' + sec.notes)) notes++;
    if (sec.status==='passed' && !ps.status) ps.status = 'good';
    if (sec.status==='failed' && !ps.status) ps.status = 'fix';
  });
  Object.values(v3.issues||{}).forEach(iss=>{
    const pid = V3MAP[iss.section]; if (!pid || !iss.desc) return;
    const open = !['verified','closed'].includes(iss.stat);
    if (!open) return;
    const ps = P(pid);
    const line = `[V3 ${iss.id||'issue'}] ${String(iss.desc).slice(0,400)}`;
    if (pushIssue(ps, line)) issues++;
  });
  for (const sh of Object.values(v3.screenshots||{})){
    const pid = V3MAP[sh.section]; if (!pid) continue;
    const raw = sh.annotatedDataUrl || sh.dataUrl || sh.img || sh.src;
    if (typeof raw !== 'string' || !raw.startsWith('data:image')) continue;
    const src = await compressImage(raw);
    const id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    imgCache.set(id, { src, flat:null });
    P(pid).shots.push({ id, note:'', ops:[], ts:Date.now() });
    try { await idb.setImg(id, { src, flat:null }); } catch(e){}
    shots++;
  }
  save(); render();
  toast(`Imported from V3 — ${checks} checkpoints, ${notes} notes, ${issues} open issues → issues, ${shots} screenshots`);
}

/* ═══ Export session ═════════════════════════════════════════════════ */
async function exportJson(){
  // Rehydrate image bytes back inline so the exported JSON is fully self-contained.
  const out = JSON.parse(JSON.stringify(state));
  for (const pid in out.pages){
    for (const s of (out.pages[pid].shots || [])){
      const rec = imgCache.get(s.id) || await idb.getImg(s.id);
      if (rec){ s.src = rec.src; s.flat = rec.flat || null; }
    }
  }
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `founder-review-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

// One-time migration: evacuate any inline base64 screenshots (v4.0 shape) from
// localStorage into IndexedDB. This also REPAIRS an already-bloated localStorage
// — the state is rewritten without image bytes — so existing sessions that hit
// "storage full" recover automatically on first load. Runs before first render.
async function migrateInlineShots(){
  let moved = 0;
  for (const pid in state.pages){
    for (const s of (state.pages[pid].shots || [])){
      if (!s.id) s.id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      let rec = null;
      if (typeof s.src === 'string' && s.src.startsWith('data:')) rec = { src:s.src, flat:(s.flat && s.flat.startsWith('data:')) ? s.flat : null };
      else if (typeof s.flat === 'string' && s.flat.startsWith('data:')){ rec = imgCache.get(s.id) || {}; rec.flat = s.flat; }
      if (rec){
        imgCache.set(s.id, rec);
        try { await idb.setImg(s.id, rec); } catch(e){}
        delete s.src; delete s.flat;
        moved++;
      }
    }
  }
  if (moved){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }  // immediate, bypass debounce
  return moved;
}

/* Report where reviews go. The founder does not choose it: the bridge lives
   inside the repo, so it already knows. This only ever reads. */
function paintRepoChip(){
  const chip = document.getElementById('repoChip');
  const connect = document.getElementById('connectBtn');
  if (!chip) return;
  if (bridgeHealth === null){ chip.textContent = 'Checking local bridge…'; chip.className = 'repochip'; return; }
  if (bridgeHealth === false){
    chip.textContent = '⚠ Command Centre not running';
    chip.title = 'Reopen this page through open-command-centre to send in one click. Until then, only the manual fallback is available.';
    chip.className = 'repochip off';
    if (connect) connect.hidden = false;      // fallback surfaces only when needed
    return;
  }
  const repo = String(bridgeHealth.repoRoot || '').split(/[\\/]/).pop() || 'repo';
  const cli = bridgeHealth.claude.available;
  chip.textContent = cli ? `✓ ${repo} · Claude ready` : `✓ ${repo} · Claude not installed`;
  chip.title = `Reviews are written to ${bridgeHealth.repoRoot}\\launch\\reviews — established by the local bridge, not picked here.`
             + (cli ? `\nClaude Code ${bridgeHealth.claude.version}` : '\nClaude Code was not found: reviews will be saved but not repaired.');
  chip.className = 'repochip ' + (cli ? 'on' : 'off');
  if (connect) connect.hidden = true;
}

/* Pick up a repair that is still running from a previous page load, so a
   reload never loses track of a real process. */
async function resumeRuns(){
  for (const p of PAGES){
    const ps = state.pages[p.id];
    const s = ps && ps.send;
    if (!s || !s.reviewId) continue;
    if (!['sending','packaged','launching','running'].includes(s.state)) continue;
    try {
      const r = await bridgeFetch(`/review/status?reviewId=${encodeURIComponent(s.reviewId)}`, {}, 5000);
      if (r.ok){
        Object.assign(s, await r.json());
        if (['packaged','launching','running'].includes(s.state)) watchRun(p);
      } else {
        // The bridge restarted and no longer knows this run. Say that rather
        // than leaving a spinner that will never resolve.
        s.state = 'blocked';
        s.reason = 'The bridge was restarted, so this run can no longer be tracked. The review package is still on disk — press Retry to hand it to Claude again.';
      }
    } catch(e){
      s.state = 'blocked';
      s.reason = 'The bridge is not reachable, so this run cannot be tracked. Your review is saved.';
    }
  }
  save();
}

async function boot(){
  try { await idb.open(); } catch(e){}
  await migrateInlineShots();
  // Deep link from Mission Control: smoke-test-v4.html#mobile opens that page
  if (location.hash && PAGES.some(p => p.id === location.hash.slice(1))) state.activePage = location.hash.slice(1);
  render();
  setStorageState();
  // Probe after the first render so the page is usable immediately; nothing
  // here starts a run, it only reads state.
  await probeBridge();
  paintRepoChip();
  if (bridgeHealth === false) await restoreRepo();   // fallback path only
  await resumeRuns();
  render();
  if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }
}
boot();
</script>
